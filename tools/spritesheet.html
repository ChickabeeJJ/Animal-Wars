<!doctype html>
<html><head><meta charset="utf-8"><title>Sprite sheet</title>
<style>body{background:#2a2f4a;color:#f4f4f4;font:11px monospace;margin:10px}h3{margin:12px 0 4px}.g{display:flex;flex-wrap:wrap;gap:6px}.c{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:90px}.f{display:flex;gap:2px;align-items:flex-end}img{image-rendering:pixelated;background:#3a4166}</style>
</head><body>
<script src="../js/content.js"></script>
<script src="../js/assets.js"></script>
<script src="../js/sprites.js"></script>
<script>
// Dev aid: every sprite enlarged for review. Open tools/spritesheet.html in a browser.
const S = AWSprites, C = AW_CONTENT;
S.setContent(C);
const q = new URLSearchParams(location.search);
const scale = Number(q.get('s') || 3);
const part = q.get('part') || 'all';
function cell(html, label) { return '<div class="c"><div class="f">' + html + '</div><span>' + label + '</span></div>'; }
function section(title, cells) { document.body.insertAdjacentHTML('beforeend', '<h3>' + title + '</h3><div class="g">' + cells.join('') + '</div>'); }
S.loadAssets().then(() => {
if (part === 'all' || part === 'heroes') section('Heroes (forms 1-3)', C.HEROES.map((h) => cell([0, 1, 2].map((f) => S.img('hero_' + h.id + '_' + f + '_0', scale)).join(''), h.names[0])));
if (part === 'all' || part === 'frames') section('Frames', C.HEROES.slice(0, 50).map((h) => cell([0, 1, 2, 3].map((f) => S.img('hero_' + h.id + '_0_' + f, scale)).join(''), h.names[0])));
if (part === 'all' || part === 'enemies') section('Gloom', C.ENEMIES.map((e) => cell([0, 1, 2, 3].map((f) => S.img('enemy_' + e.id + '_' + f, scale)).join(''), e.name)));
if (part === 'all' || part === 'misc') {
  section('Bases', [0, 1, 2, 3].map((d) => cell(S.img('burrow_' + d, 2), 'burrow ' + d)).concat([0, 1, 2, 3, 4, 5, 6, 7].map((t) => cell(S.img('tower_' + t + '_0', 2), 'tower ' + t))));
  section('Eggs', [0, 1, 2, 3, 4].map((r) => cell(S.img('egg_' + r, 4) + S.img('egg_' + r + '_c', 4), 'egg ' + r)));
  section('Icons', S.ICONS.map((k) => cell(S.img('icon_' + k, 3), k)));
}
document.body.dataset.ready = '1';
});
</script></body></html>
