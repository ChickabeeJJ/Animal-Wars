:root {
  --gut: 10px;
  --dock-h: 176px;
  --ink: #1a0f12; --deep: #0b0b16; --night: #1a1c2c;
  --brown: #4a2e1e; --brown-l: #7a5030; --wood: #9a6438; --parch: #f3e2bc; --parch-d: #e2cb9a; --parch-dd: #c9a66b;
  --plum: #5d275d; --berry: #b13e53; --peach: #ef7d57; --butter: #ffcd75; --gold: #ffc23d;
  --lime: #a7f070; --green: #38b764; --teal: #257179; --blue: #3b5dc9; --sky: #41a6f6; --cyan: #73eff7;
  --cream: #fff8e8; --mist: #94b0c2; --slate: #566c86; --dusk: #333c57; --pink: #ffa8c5; --lav: #a884f3; --mythic: #ff6fd0;
  --r0: #9aa8bb; --r1: #2f86e0; --r2: #8a5ae0; --r3: #e0a020; --r4: #e04aa8;
  --font: 'Cozy', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--deep); color: var(--brown);
  font-family: var(--font); font-size: 15px; line-height: 1.32;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
button:focus { outline: none; }
button:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }
img.px, .px { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px { display: inline-block; vertical-align: middle; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.rc0 { color: #6a7890; } .rc1 { color: var(--r1); } .rc2 { color: var(--r2); } .rc3 { color: #c08010; } .rc4 { color: var(--r4); }
.good { color: #2e8a3a; } .bad { color: #c03040; }

/* Frame utilities ---------------------------------------------------------------- */
[class*="fx-"] { border-style: solid; border-color: transparent; image-rendering: pixelated; background-clip: padding-box; }
.fx-win { border-width: 18px; border-image: var(--f-win) var(--fs-win) fill / 18px stretch; }
.fx-windark { border-width: 18px; border-image: var(--f-windark) var(--fs-windark) fill / 18px stretch; }
.fx-card { border-width: 8px 8px 10px; border-image: var(--f-card) var(--fs-card) fill / 8px 8px 10px stretch; }
.fx-cardDark { border-width: 8px 8px 10px; border-image: var(--f-cardDark) var(--fs-cardDark) fill / 8px 8px 10px stretch; }
.fx-cardHot { border-width: 8px 8px 10px; border-image: var(--f-cardHot) var(--fs-cardHot) fill / 8px 8px 10px stretch; }
.fx-inset { border-width: 8px; border-image: var(--f-inset) var(--fs-inset) fill / 8px stretch; }
.fx-insetDark { border-width: 6px; border-image: var(--f-insetDark) var(--fs-insetDark) fill / 6px stretch; }
.fx-plaque { border-width: 8px; border-image: var(--f-plaque) var(--fs-plaque) fill / 8px stretch; }
.fx-plaqueWood { border-width: 8px; border-image: var(--f-plaqueWood) var(--fs-plaqueWood) fill / 8px stretch; }
.fx-ribbon { border-width: 6px 28px 10px; border-image: var(--f-ribbon) var(--fs-ribbon) fill / 6px 28px 10px stretch; }
.fx-ribbonGold { border-width: 6px 28px 10px; border-image: var(--f-ribbonGold) var(--fs-ribbonGold) fill / 6px 28px 10px stretch; }
.fx-ribbonBlue { border-width: 6px 28px 10px; border-image: var(--f-ribbonBlue) var(--fs-ribbonBlue) fill / 6px 28px 10px stretch; }
.fx-rar0 { border-width: 12px; border-image: var(--f-rar0) var(--fs-rar0) fill / 12px stretch; }
.fx-rar1 { border-width: 12px; border-image: var(--f-rar1) var(--fs-rar1) fill / 12px stretch; }
.fx-rar2 { border-width: 12px; border-image: var(--f-rar2) var(--fs-rar2) fill / 12px stretch; }
.fx-rar3 { border-width: 12px; border-image: var(--f-rar3) var(--fs-rar3) fill / 12px stretch; }
.fx-rar4 { border-width: 12px; border-image: var(--f-rar4) var(--fs-rar4) fill / 12px stretch; }
/* Buttons: glossy 3D pixel buttons. Pressed swaps to the shallow frame and drops the face (and label) by 6px.
 * Labels are pixel-font images (game.js pixelizes button text); .sr keeps the words for screen readers. */
[class*="fx-btn-"] { position: relative; border-width: 8px 8px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: #fff;
  text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), 0 2px 0 var(--ink); white-space: nowrap; line-height: 1.05; transition: filter 80ms steps(2), transform 80ms steps(2); }
.fx-btn-green { border-image: var(--f-btn_green) var(--fs-btn_green) fill / 8px 8px 16px stretch; }
.fx-btn-gold { border-image: var(--f-btn_gold) var(--fs-btn_gold) fill / 8px 8px 16px stretch; }
.fx-btn-blue { border-image: var(--f-btn_blue) var(--fs-btn_blue) fill / 8px 8px 16px stretch; }
.fx-btn-red { border-image: var(--f-btn_red) var(--fs-btn_red) fill / 8px 8px 16px stretch; }
.fx-btn-purple { border-image: var(--f-btn_purple) var(--fs-btn_purple) fill / 8px 8px 16px stretch; }
.fx-btn-gray { border-image: var(--f-btn_gray) var(--fs-btn_gray) fill / 8px 8px 16px stretch; }
.fx-btn-wood { border-image: var(--f-btn_wood) var(--fs-btn_wood) fill / 8px 8px 16px stretch; }
.fx-btn-pink { border-image: var(--f-btn_pink) var(--fs-btn_pink) fill / 8px 8px 16px stretch; }
.fx-btn-dark { border-image: var(--f-btn_dark) var(--fs-btn_dark) fill / 8px 8px 16px stretch; }
.fx-btn-teal { border-image: var(--f-btn_teal) var(--fs-btn_teal) fill / 8px 8px 16px stretch; }
.fx-btn-orange { border-image: var(--f-btn_orange) var(--fs-btn_orange) fill / 8px 8px 16px stretch; }
[class*="fx-btn-"]:active:not([disabled]) { border-width: 14px 8px 10px; }
.fx-btn-green:active:not([disabled]) { border-image: var(--f-btnp_green) var(--fs-btnp_green) fill / 14px 8px 10px stretch; }
.fx-btn-gold:active:not([disabled]) { border-image: var(--f-btnp_gold) var(--fs-btnp_gold) fill / 14px 8px 10px stretch; }
.fx-btn-blue:active:not([disabled]) { border-image: var(--f-btnp_blue) var(--fs-btnp_blue) fill / 14px 8px 10px stretch; }
.fx-btn-red:active:not([disabled]) { border-image: var(--f-btnp_red) var(--fs-btnp_red) fill / 14px 8px 10px stretch; }
.fx-btn-purple:active:not([disabled]) { border-image: var(--f-btnp_purple) var(--fs-btnp_purple) fill / 14px 8px 10px stretch; }
.fx-btn-gray:active:not([disabled]) { border-image: var(--f-btnp_gray) var(--fs-btnp_gray) fill / 14px 8px 10px stretch; }
.fx-btn-wood:active:not([disabled]) { border-image: var(--f-btnp_wood) var(--fs-btnp_wood) fill / 14px 8px 10px stretch; }
.fx-btn-pink:active:not([disabled]) { border-image: var(--f-btnp_pink) var(--fs-btnp_pink) fill / 14px 8px 10px stretch; }
.fx-btn-dark:active:not([disabled]) { border-image: var(--f-btnp_dark) var(--fs-btnp_dark) fill / 14px 8px 10px stretch; }
.fx-btn-teal:active:not([disabled]) { border-image: var(--f-btnp_teal) var(--fs-btnp_teal) fill / 14px 8px 10px stretch; }
.fx-btn-orange:active:not([disabled]) { border-image: var(--f-btnp_orange) var(--fs-btnp_orange) fill / 14px 8px 10px stretch; }
@media (hover: hover) { [class*="fx-btn-"]:hover:not([disabled]) { filter: brightness(1.12) saturate(1.1); } }
[class*="fx-btn-"][disabled] { filter: grayscale(.9) brightness(.72); cursor: default; }
[class*="fx-btn-"] img.px:not(.ptxt) { width: 16px; height: 16px; }
[class*="fx-btn-"] img.ptxt { filter: drop-shadow(0 1px 0 rgba(26, 15, 18, .35)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.blbl { display: inline-flex; align-items: center; gap: 6px; }
[class*="fx-btn-"] > .pl, [class*="fx-btn-"] .blbl { flex: 0 1 auto; min-width: 0; }

/* Text buttons */

#app { position: relative; height: 100%; overflow: hidden; }

/* Currency pills ------------------------------------------------------------------ */
.curs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
.cur { position: relative; display: flex; align-items: center; height: 36px; min-width: 96px; padding: 0 22px 0 30px; border-width: 8px; border-image: var(--f-plaque) var(--fs-plaque) fill / 8px stretch; border-style: solid; border-color: transparent; image-rendering: pixelated; color: #fff; font-weight: 700; font-size: 16px; text-shadow: 1px 1px 0 var(--ink); }

.curs.small .cur { height: 30px; min-width: 76px; font-size: 13px; padding: 0 8px 0 24px; }

/* Home ---------------------------------------------------------------------------- */
.home-ui { position: absolute; inset: 0; pointer-events: none; }

.h-top { position: absolute; left: var(--gut); right: var(--gut); top: var(--gut); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }

.profile { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; color: #fff; text-align: left; flex: 0 0 auto; }

.avatar img.px { height: 36px; width: auto; }
.pinfo { display: flex; flex-direction: column; gap: 1px; min-width: 110px; }

.pinfo .rank { font-size: 12px; color: var(--butter); }
.rbar { display: block; height: 16px; }

.h-top .curs { flex: 1 1 auto; padding-top: 10px; }
.corner { display: flex; gap: 6px; flex: 0 0 auto; }

.quests { position: absolute; left: var(--gut); top: 92px; width: 236px; padding: 4px 6px 6px; color: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }

.q-head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--butter); text-shadow: 1px 1px 0 var(--ink); }

.q { display: grid; grid-template-columns: 1fr auto; gap: 1px 6px; align-items: center; font-size: 12px; }

.side { position: absolute; right: var(--gut); top: 92px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

.sb .sbl { margin-top: -6px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink); white-space: nowrap; z-index: 1; }
.sb .sbt { margin-top: 1px; padding: 0 5px; font-size: 11px; background: rgba(26, 15, 18, .8); box-shadow: 0 0 0 1px var(--ink); color: var(--butter); text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink); white-space: nowrap; }

.h-center { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }

.goal { min-height: 40px; padding: 2px 14px; color: #fff; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 6px; pointer-events: auto; }

  background: linear-gradient(180deg, transparent 0 22px, #2a160c 22px 25px, #c08a52 25px 28px, #9a6438 28px 52px, #7a4a28 52px 54px, #9a6438 54px 78px, #6a3e22 78px); pointer-events: none; }

.bossbar { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 10px 4px; pointer-events: none; color: #fff; }

@keyframes ringGlow { 50% { box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c, 0 0 18px 4px rgba(167, 240, 112, .8); } }
.roar { --rc: #ffcd4d; }

.roar.ready { animation: roarShake 500ms steps(2) infinite; }
.roar.ready .ring { box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c, 0 0 22px 6px rgba(255, 205, 77, .85); }
@keyframes roarShake { 50% { transform: rotate(-3deg) scale(1.03); } }
.roar.active .orb-in { background: radial-gradient(circle at 35% 30%, #fffbe0, #ffcd4d 55%, #e8962a 80%); }
.roar.active .ring { animation: ringGold 520ms steps(2) infinite; }
.roar.active .lv { color: var(--ink); text-shadow: 1px 1px 0 #fff6c8; }
@keyframes ringGold { 50% { box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c, 0 0 26px 8px rgba(255, 224, 102, .9); } }
.cards { flex: 1 1 auto; min-width: 0; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: 6px; }
.card { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; padding: 0; }
.cards .card { border-width: 6px; border-image-width: 6px; }
.card .cbg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 36%, var(--cg, #5a6478) 0, #1c1a34 80%); }
.card.r0 { --cg: #66708a; } .card.r1 { --cg: #2f6ac8; } .card.r2 { --cg: #7048c8; } .card.r3 { --cg: #c08a1a; } .card.r4 { --cg: #c83a90; }
.card .cart { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: calc(100% - 16px); }
.card .cart img.px { filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .4)); }
.card .cost { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 2px 0 1px; font-size: 15px; font-weight: 700; color: var(--butter); background: linear-gradient(180deg, rgba(26, 15, 18, .7), #1a0f12); text-shadow: 1px 1px 0 var(--ink); }
.card .cost img.px { width: 16px; height: 16px; }
.card .key { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 700; color: #fff; background: rgba(26, 15, 18, .75); padding: 0 4px; }
.card .cdv { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--p, 0) * 100%); background: rgba(10, 8, 20, .74); box-shadow: 0 2px 0 0 rgba(255, 255, 255, .28); pointer-events: none; }
.card:not(.cool) .cdv { box-shadow: none; }
.card .cds { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink); pointer-events: none; }
.card.poor .cart img.px { filter: grayscale(.6) brightness(.8); }
.card.poor .cost { color: #ff8a8a; }
.card.cool .cart img.px { filter: grayscale(.5) brightness(.8); }
.card.ok .cbg { background: radial-gradient(ellipse at 50% 36%, color-mix(in srgb, var(--cg) 70%, #ffffff) 0, var(--cg) 30%, #1c1a34 85%); }
.card.ok:hover { filter: brightness(1.1); }
.card.ok:active { transform: translateY(2px); }
.card.ready { animation: readyPop 300ms steps(3); }
@keyframes readyPop { 50% { transform: scale(1.08); filter: brightness(1.4); } }
.card.empty { opacity: .35; }

/* Toasts --------------------------------------------------------------------------- */
.toasts { position: absolute; right: var(--gut); top: 64px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; z-index: 70; max-width: 70%; }
.toast { padding: 0 6px; font-size: 14px; color: #fff; text-shadow: 1px 1px 0 var(--ink); animation: toastIn 240ms steps(4); display: flex; align-items: center; gap: 6px; }
.toast b { color: var(--butter); }
.toast img.px { width: auto; height: 16px; }
.toast.green b { color: var(--lime); } .toast.pink b { color: var(--pink); } .toast.violet b { color: #d0b8ff; }
.toast.out { opacity: 0; transition: opacity 200ms steps(2); }
@keyframes toastIn { from { transform: translateX(30px); opacity: 0; } }

/* Windows (menus) ------------------------------------------------------------------ */
.wrap { position: absolute; inset: 0; z-index: 10; display: flex; align-items: stretch; justify-content: center; padding: 8px; background: rgba(11, 11, 22, .55); animation: wrapIn 200ms steps(4); }
@keyframes wrapIn { from { opacity: 0; } }
.window { position: relative; width: min(1200px, 100%); display: flex; flex-direction: column; min-height: 0; animation: winIn 260ms steps(5); }
@keyframes winIn { from { transform: translateY(30px) scale(.96); } }
.w-head { position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 4px 10px 0; margin: -4px 0 0; }
.w-title { min-width: 220px; height: 52px; padding: 0 8px; display: flex; align-items: center; justify-content: center; }
.w-title img.px { display: block; }
.w-head .w-title { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); z-index: 2; }
.w-head .curs { margin-left: auto; flex-wrap: nowrap; gap: 16px; padding-left: 10px; }
.w-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 8px 16px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: var(--parch-dd) transparent; }
.w-body > * { flex: 0 0 auto; }
.sec { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.sec h3 { margin: 0; font-size: 18px; color: var(--brown); display: flex; align-items: center; gap: 8px; letter-spacing: .2px; }
.sec h3 img.px { width: 16px; height: 16px; }
.sec .sub { font-size: 12px; color: #8a6a48; }
.sec .grow { flex: 1; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { position: relative; min-height: 38px; padding: 0 4px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.panel-note { font-size: 13px; line-height: 1.45; color: #8a6a48; margin: 0 2px; }

/* Map */
.diffs { display: flex; gap: 6px; }
.regions { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 8px; scrollbar-width: thin; }
.rg { position: relative; flex: 0 0 auto; width: 160px; padding: 0; text-align: left; color: #fff; }
.rg .rgi { display: block; width: 100%; height: 60px; background-size: cover; background-position: center bottom; image-rendering: pixelated; }
.rg .rgn { display: block; padding: 4px 8px 3px; font-size: 12px; font-weight: 700; background: #2a1a12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg .rgk { position: absolute; left: 4px; top: 4px; min-width: 20px; height: 20px; padding: 0 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: rgba(26, 15, 18, .85); box-shadow: 0 0 0 1px var(--ink); }
.rg .rgs { position: absolute; right: 4px; top: 4px; display: flex; align-items: center; gap: 3px; height: 20px; font-size: 12px; font-weight: 700; padding: 0 5px; background: rgba(26, 15, 18, .85); color: var(--butter); box-shadow: 0 0 0 1px var(--ink); }
.rg .rgs img.px { width: 16px; height: 16px; }
.rg.on { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--gold)); }
.rg.on .rgn { background: #c83e4e; }
.rg.locked .rgi { filter: grayscale(1) brightness(.45); }
.rg.locked .rgn { color: #a08060; }
.rg .lk { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); }
.rg .lk img.px { width: 16px; height: 16px; }
.mapview { position: relative; height: clamp(280px, 52vh, 460px); background-size: cover; background-position: center bottom; image-rendering: pixelated; overflow: hidden; border: 0 !important; border-image: none !important; box-shadow: 0 0 0 3px #2a160c, inset 0 0 0 3px rgba(255, 255, 255, .25), inset 0 -40px 60px -30px rgba(0, 0, 0, .25); margin: 3px; }
.mapscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.mapscroll .mapview { min-width: 640px; }
.mapview svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapview .mv-title { position: absolute; left: 12px; top: 10px; }
.mapview .mv-stars { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 4px; color: #fff; font-weight: 700; font-size: 16px; padding: 0 6px; }
.mapview .mv-stars img.px { width: 16px; height: 16px; }
.node { position: absolute; transform: translate(-50%, -50%); width: 52px; height: 52px; padding: 0; font-size: 18px; }
.node.boss { width: 70px; height: 70px; }
.node .ns { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); display: flex; gap: 0; margin-top: -2px; }
.node .ns img.px { width: 16px; height: 16px; }
.node .nb { position: absolute; left: 50%; bottom: 72%; transform: translateX(-50%); pointer-events: none; }
.node .nb img.px { height: 44px; width: auto; }
.node.boss .nb img.px { height: 62px; }
.node.next { animation: nodeBounce 700ms steps(2) infinite; }
@keyframes nodeBounce { 50% { transform: translate(-50%, -58%); } }
.node .lockic img.px { width: 16px; height: 16px; }
.chests { display: flex; gap: 8px; align-items: stretch; }
.chest { flex: 1; display: flex; align-items: center; gap: 8px; padding: 2px 6px; min-height: 52px; color: var(--brown); text-align: left; font-size: 13px; }
.chest > img.px { width: 32px; height: 32px; }
.chest .cr { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-weight: 700; }
.chest .cr img.px { width: 16px; height: 16px; }
.chest.done { opacity: .55; }
.chest .cbar { height: 10px; margin-top: 3px; }
.chest .cbar i { display: block; height: 100%; background: linear-gradient(180deg, #fff0a0, #ffc23d 50%, #d08a20); }

/* Shared tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 8px; color: var(--brown); text-align: left; min-width: 0; }
.tile > p { margin: 0; line-height: 1.45; }
.tile h4 { margin: 0; font-size: 15px; }
.loot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.lt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 76px; padding: 0 4px; font-weight: 700; font-size: 16px; color: var(--brown); }
.lt img.px { width: 32px; height: 32px; }
.lt small { font-size: 10px; font-weight: 400; color: #8a6a48; }
.lt.new { filter: drop-shadow(0 0 5px rgba(255, 200, 60, .9)); }
.foes { display: flex; flex-wrap: wrap; gap: 8px; }
.foe { display: flex; flex-direction: column; align-items: center; width: 82px; padding: 0 2px; color: #fff; }
.foe .fi { height: 46px; display: flex; align-items: flex-end; justify-content: center; }
.foe .fi img.px { height: 44px; width: auto; max-width: 74px; }
.foe span { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.05; }
.foe.boss { filter: drop-shadow(0 0 6px var(--mythic)); }
.trait { display: inline-block; padding: 0 4px; font-size: 10px; font-weight: 700; color: var(--ink); text-shadow: none; box-shadow: 0 0 0 1px var(--ink); margin: 1px; }
.goals { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.goals div { display: flex; align-items: center; gap: 8px; }
.goals img.px { width: 16px; height: 16px; }
.goals .off { color: #a08060; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 4px; text-align: left; font-size: 13px; color: var(--brown); min-height: 50px; }
.item > img.px { width: 32px; height: 32px; }
.item b { font-size: 12px; }
.item .ic { position: absolute; right: -4px; top: -6px; font-size: 12px; font-weight: 700; padding: 0 5px; background: var(--ink); color: var(--butter); }
.item.on { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #5ac54f); }
.item.on::after { content: "ON"; position: absolute; left: -4px; top: -6px; font-size: 10px; font-weight: 700; padding: 0 4px; background: #5ac54f; color: var(--ink); }
.item.none { opacity: .5; }
.lineup-mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.lm { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.lm img.px { height: 30px; width: auto; }
.lm.empty { opacity: .35; }

/* Army */
.shelf { padding: 6px 8px 4px; }
.lineup { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.slot { position: relative; aspect-ratio: 1 / 1.05; display: flex; align-items: center; justify-content: center; overflow: visible; padding: 0; min-width: 0; }
.slot img.px:not(.fit) { height: 46px; width: auto; max-width: 120%; }
.slot .lv, .hero .lv { position: absolute; right: -8px; bottom: -9px; font-size: 11px; font-weight: 700; padding: 0 4px; color: #fff; background: rgba(26, 15, 18, .85); text-shadow: none; }
.slot.empty { font-size: 22px; color: #a08060; }
.slot.pick { animation: pulse 700ms steps(2) infinite; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0; padding: 0; min-height: 120px; color: var(--brown); }
.hero .hi { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 64px; max-height: 72px; overflow: hidden; }
.hero .hi img.px { height: 62px; width: auto; max-width: 100%; }
.hero .hn { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.05; margin-top: 2px; }
.hero .hst { display: flex; gap: 0; }
.hero .hst img.px { width: 16px; height: 16px; }
.hero .inl { position: absolute; left: -8px; top: -8px; font-size: 10px; font-weight: 700; color: var(--ink); background: var(--lime); padding: 0 4px; box-shadow: 0 0 0 1px var(--ink); }
.hero .up { position: absolute; right: -6px; top: -8px; width: 18px; height: 18px; background: #5ac54f; box-shadow: 0 0 0 2px var(--ink); clip-path: polygon(50% 0, 100% 55%, 70% 55%, 70% 100%, 30% 100%, 30% 55%, 0 55%); animation: badgePop 800ms steps(2) infinite; }
.hero.locked img.px { filter: brightness(0) invert(.25) sepia(.4); }
.hero.locked .hn { color: #8a6a48; }
.hero:not(.locked):active { transform: translateY(2px); }
.new-tag { position: absolute; right: -8px; top: -8px; font-size: 10px; font-weight: 700; background: #e04848; color: #fff; padding: 0 4px; box-shadow: 0 0 0 1px var(--ink); }

.hd { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
.hd-art { position: relative; height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; background: radial-gradient(circle at 50% 70%, rgba(255, 255, 255, .7), transparent 60%); }
.hd-art > img.px { height: 150px; width: auto; max-width: 196px; }
.hd-art .pedestal { width: 150px; height: 14px; margin-top: -8px; background: #8a6a48; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #b08a60; border-radius: 50%; }
.hd-r { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); padding: 0 6px; color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
.hd-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hd-name { font-size: 22px; font-weight: 700; }
.lvbar { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.lvbar .bar { flex: 1; height: 18px; }
.lvbar .bar i { display: block; height: 100%; background: linear-gradient(180deg, #fff0a0, #ffc23d 50%, #d08a20); }
.forms { display: flex; gap: 6px; }
.forms span { display: flex; flex-direction: column; align-items: center; padding: 0 2px; font-size: 10px; }
.forms img.px { height: 34px; width: auto; }
.forms span.lock img.px { filter: brightness(0) invert(.3); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.stat { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 2px 6px; font-size: 13px; }
.stat img.px { width: 16px; height: 16px; grid-row: 1 / span 2; }
.stat b { font-size: 14px; }
.stat b em { font-style: normal; color: #2e8a3a; font-size: 11px; margin-left: 3px; }
.stat .sbar { grid-column: 2 / span 2; height: 6px; background: #c9a66b; box-shadow: 0 0 0 1px #8a6a48; }
.stat .sbar i { display: block; height: 100%; background: #e07a3a; }
.abil { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: #fff; background: #5a3a24; box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 0 #8a5a3a; text-shadow: 1px 1px 0 var(--ink); }
.chip.hot { background: #8a3a9a; box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 0 #c070d0; }
.evo { padding: 2px 6px; display: flex; align-items: center; gap: 10px; }
.evo .need { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700; }
.evo .need span { display: inline-flex; align-items: center; gap: 2px; }
.evo .need img.px { width: 16px; height: 16px; }
.evo .need .no { color: #c03040; }

/* Lab */
.labg { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.lr { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: start; padding: 6px 8px 6px 6px; color: var(--brown); }
.lr .li { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
.lr .li img.px { width: 32px; height: 32px; }
.lmain { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lhead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lhead .ln { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lhead .lvl { margin-left: auto; flex: 0 0 auto; font-size: 12px; font-weight: 700; color: #fff; background: #5a3a24; padding: 1px 7px; box-shadow: 0 0 0 1px var(--ink), inset 0 1px 0 0 #8a5a3a; text-shadow: 1px 1px 0 var(--ink); }
.lhead .lvl small { font-size: 11px; color: #e8c8a0; }
.lr .lx { font-size: 12px; line-height: 1.35; color: #6a4a30; min-height: 32px; }
.lfx { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; margin-top: 2px; }
.lfx .bt2 { margin-left: auto; min-width: 104px; }
.lfx .now { color: #6a4a30; }
.lfx .arrow { font-size: 9px; color: #b08a60; }
.lfx .nxt { color: #2e8a3a; }
.lfx .mx { color: #c08010; }
.lbar { height: 10px; }
.lbar i { display: block; height: 100%; background: linear-gradient(180deg, #c8f0a0, #5ac54f 50%, #2e8a3a); }

/* Boost shop */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.ware { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 8px; color: var(--brown); min-width: 0; }
.ware .wtop { display: flex; align-items: center; gap: 10px; }
.ware .wi { width: 48px; height: 48px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
.ware .wi img.px { width: 32px; height: 32px; }
.ware b { display: block; font-size: 15px; }
.ware .own { font-size: 12px; color: #8a6a48; }
.ware p { margin: 0; flex: 1 1 auto; font-size: 13px; line-height: 1.4; color: #6a4a30; }

/* Event levels */
.evls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.evl { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-height: 64px; padding: 4px 8px 6px; text-align: left; color: var(--brown); }
.evl b { font-size: 14px; }
.evl .cr { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13px; font-weight: 700; }
.evl.locked { color: #f3e2bc; }
.evl.locked .cr { color: #d8c09a; font-weight: 400; }
.evl.locked .cr img.px { width: 16px; height: 16px; }
@media (max-width: 820px) { .evls { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Rewards */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 2px; font-size: 11px; font-weight: 700; color: var(--brown); text-align: center; }
.day > img.px { width: 32px; height: 32px; }
.day b { font-size: 13px; }
.day.got::after { content: "✓"; position: absolute; inset: -8px; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #2e8a3a; background: rgba(243, 226, 188, .55); text-shadow: 2px 2px 0 #fff; }
.day.today { animation: pulse 900ms steps(2) infinite; }
.mis { display: grid; grid-template-columns: 1fr 150px 96px; gap: 6px 14px; align-items: center; min-height: 34px; padding: 2px 4px; font-size: 14px; color: var(--brown); }
.mis + .mis { border-top: 2px dashed rgba(201, 166, 107, .55); }
.mis .mb { height: 16px; position: relative; }
.mis .mb i { display: block; height: 100%; background: linear-gradient(180deg, #c8f0a0, #5ac54f 50%, #2e8a3a); }
.mis .mb span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.mis .mr { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-weight: 700; font-size: 13px; }
.mis .bt2 { justify-self: end; }
.mis .mr img.px { width: 16px; height: 16px; }
.mis.claimed { opacity: .5; }
.farm { display: flex; align-items: center; gap: 12px; padding: 2px 6px; }
.farm > img.px { width: 48px; height: 48px; }
.farm .fv { font-size: 22px; font-weight: 700; }

/* Hatchery */
.banner { position: relative; display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; padding: 6px 8px; color: #fff; overflow: hidden; }
.banner .bn-art { position: relative; height: 170px; display: flex; align-items: flex-end; justify-content: center; }

.banner .bn-art img.px { position: relative; }
.banner .bn-art .egg-big { width: 84px; height: 100px; animation: wob 1.2s steps(2) infinite; }
.banner .bn-art .fh { position: absolute; bottom: 0; height: 74px; width: auto; }
.banner .bn-art .fh.l { left: 2px; } .banner .bn-art .fh.r { right: 2px; }
.banner h3 { margin: 0; }
.banner p { margin: 0; font-size: 13px; text-shadow: 1px 1px 0 var(--ink); }
.banner .feat { display: flex; gap: 6px; flex-wrap: wrap; }

.bn-btns .bt2 img.px { width: 16px; height: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.rates { font-size: 12px; color: #6a4a30; line-height: 1.6; padding: 2px 6px; }

.hatchery { position: absolute; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 42%, #4a3070, #1a1030 55%, #07070f 85%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.h-rays { position: absolute; left: 50%; top: 40%; width: 0; height: 0; pointer-events: none; }
.h-rays.on::before { content: ""; position: absolute; left: -380px; top: -380px; width: 760px; height: 760px; background: repeating-conic-gradient(var(--rc, #ffcd75) 0 9deg, transparent 9deg 24deg); opacity: .4; animation: spin 7s linear infinite; mask: radial-gradient(circle, #000 15%, transparent 68%); -webkit-mask: radial-gradient(circle, #000 15%, transparent 68%); }
.h-stage { position: relative; min-height: 250px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; max-width: 96%; }
.h-stage .egg img.px { width: 140px; height: 168px; }
.h-stage .egg.wob img.px { animation: wob 140ms steps(2) infinite; }
.h-stage .got { display: flex; flex-direction: column; align-items: center; }
.h-stage .got > img.px { height: 200px; width: auto; max-width: 300px; animation: popIn 420ms steps(6); }
.h-stage .got .pedestal { width: 200px; height: 18px; margin-top: -10px; border-radius: 50%; background: radial-gradient(#ffffff55, transparent 70%); }
@keyframes popIn { from { transform: scale(.2) translateY(60px); } 70% { transform: scale(1.15); } }
.h-info { min-height: 92px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
.h-info .hx { font-size: 16px; font-weight: 700; color: var(--lime); text-shadow: 2px 2px 0 var(--ink); }
.h-info .hx.dupe { color: var(--butter); }
.h-btns { display: flex; gap: 12px; }
.sum { display: grid; grid-template-columns: repeat(5, 110px); gap: 10px; }
.sparkle { position: absolute; width: 6px; height: 6px; background: #fff; box-shadow: 0 0 0 2px var(--rc, #ffcd75); animation: spark 900ms steps(6) forwards; pointer-events: none; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* Modal ---------------------------------------------------------------------------- */
.modal { position: absolute; inset: 0; z-index: 40; background: rgba(11, 11, 22, .62); display: flex; align-items: center; justify-content: center; padding: 30px 12px 12px; animation: wrapIn 160ms steps(3); }
.modal-box { position: relative; width: min(640px, 100%); max-height: 100%; overflow: visible; display: flex; flex-direction: column; animation: winIn 240ms steps(5); }
.modal-box > .w-title { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); z-index: 2; }
.modal-box > .w-title:empty { display: none; }
.modal-box .x { position: absolute; right: -22px; top: -22px; z-index: 3; }
#modal-body { overflow-y: auto; max-height: calc(100vh - 170px); display: flex; flex-direction: column; gap: 14px; padding: 20px 8px 4px; color: var(--brown); }
#modal-body p { margin: 0; font-size: 14px; line-height: 1.5; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; padding: 0 4px 2px; }
.modal-actions:empty { display: none; }
.modal-actions .bt2 { min-width: 110px; }
.modal.result { background: radial-gradient(circle at 50% 30%, rgba(80, 50, 20, .35), rgba(11, 11, 22, .75)); }
.res-head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -54px; }
.modal.result #modal-body { overflow: visible; max-height: none; }
.modal.result .modal-box { margin-top: 40px; }
.res-head .rays { position: absolute; left: 50%; top: 40px; width: 520px; height: 520px; margin-left: -260px; margin-top: -260px; background: repeating-conic-gradient(rgba(255, 220, 120, .35) 0 10deg, transparent 10deg 26deg); animation: spin 10s linear infinite; mask: radial-gradient(circle, #000 10%, transparent 60%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); pointer-events: none; }
.res-head img.ptxt { position: relative; animation: popIn 500ms steps(6); }
.rstars { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.rstars img.px { width: 48px; height: 48px; }
.rstars img.px:nth-child(2) { width: 64px; height: 64px; margin-bottom: 8px; }
.rstars img.pop { animation: starPop 500ms steps(6) both; }
@keyframes starPop { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
.tip-line { font-size: 13px; line-height: 1.5; color: #6a4a30; text-align: center; margin: 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 6px; border-bottom: 2px dashed var(--parch-dd); font-size: 15px; font-weight: 700; }
.switch { width: 64px; height: 30px; position: relative; background: #c9a66b; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #a08060; }
.switch::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 22px; background: #fff8e8; box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 0 #c9a66b; transition: left 120ms steps(3); }
.switch.on { background: #5ac54f; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #2e8a3a; }
.switch.on::after { left: 34px; }

.tip { position: fixed; z-index: 60; max-width: 240px; padding: 7px 9px; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; }

/* Phones ------------------------------------------------------------------------------- */
@media (max-width: 900px) {

}

  .actionbar { height: auto; flex-wrap: wrap; gap: 8px; padding: 0 8px 8px; background: linear-gradient(180deg, transparent 0 70px, #2a160c 70px 73px, #9a6438 73px); }
  .battle-wrap { order: -1; flex: 1 1 100%; margin: 0; display: flex; justify-content: center; }
  .battle-wrap::before { display: none; }

  .bb small { flex: 1 1 100%; text-align: center; }
  .nav { flex: 1 1 0; gap: 6px; }
  .nb { flex: 1 1 0; width: auto; height: 64px; min-width: 0; }

}
@media (max-width: 640px) {
  :root { --gut: 8px; }

  .h-top .curs .cur { min-width: 0; }

  .avatar { width: 50px; height: 50px; }
  .h-top { flex-wrap: wrap; }
  .h-top .curs { order: 3; flex: 1 1 100%; padding-top: 0; }

  .lineup, .lineup-mini { grid-template-columns: repeat(5, 1fr); }
  .roster { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
  .hero { min-height: 104px; }
  .hero .hi img.px { height: 48px; }
  .cal { grid-template-columns: repeat(4, 1fr); }
  .mis { grid-template-columns: 1fr auto; }
  .mis .mb { grid-column: 1 / span 2; grid-row: 2; }
  .sum { grid-template-columns: repeat(5, 62px); gap: 6px; }

  .sum .hero .hi img.px { height: 38px; }
  .stats { grid-template-columns: 1fr; }
  .w-head .w-title { top: -22px; min-width: 160px; }
  .w-head .curs { display: none; }
  .chests { flex-direction: column; }
  .orb { width: 84px; height: 84px; }
  .orb .oi img.px { width: 32px; height: 32px; }
  .bh-plate { min-width: 120px; }
  .bh-name { max-width: 140px; font-size: 12px; }
  .bh-row .hpbar { width: 90px; }
  .acorns b { font-size: 22px; }
}
@media (max-height: 520px) {
  :root { --dock-h: 118px; }
  .h-center { top: 54px; }
  .logo { transform: scale(.42); transform-origin: 50% 0; margin-bottom: -130px; animation: none; }
  .hd-art { height: 140px; }
  .hd-art > img.px { height: 100px; }
  .goal { display: none; }
  .modal.result .modal-box { margin-top: 30px; }
  .modal.result #modal-body { overflow-y: auto; max-height: calc(100vh - 150px); }
  .res-head { margin-top: 0; }
  .rstars img.px { width: 32px; height: 32px; }
  .rstars img.px:nth-child(2) { width: 48px; height: 48px; }
  #modal-body { max-height: calc(100vh - 150px); }
  .modal { padding-top: 34px; }
  .quests { top: 78px; }
  .side { top: 74px; gap: 2px; }
  .sb .sbi { width: 48px; height: 48px; }
  .sb .sbi img.px { width: 32px; height: 32px; }
  .actionbar { height: 74px; padding-bottom: 6px; background: linear-gradient(180deg, transparent 0 16px, #2a160c 16px 19px, #9a6438 19px); }
  .nb { width: 64px; height: 60px; }
  .nb .ni img.px { width: 32px; height: 32px; }
  .bb { width: 210px; height: 96px; }
  .battle-wrap { margin-top: -30px; }
  .orb { width: 86px; height: 86px; }
  .orb .oi img.px { width: 32px; height: 32px; }
  .mapview { height: 230px; }
}
/* Portrait phones: a wide battlefield band on top, big deploy cards below. */
@media (orientation: portrait) and (max-width: 700px) {
  #app.battle #view { flex: 0 0 auto; height: min(88vw, 56vh); }
  #app.battle .cards { max-height: 300px; align-self: end; }
  #app.battle .dock { flex: 1 1 auto; height: auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 112px 1fr; gap: 14px 10px; padding: 14px 10px 10px; align-items: stretch; }
  #app.battle .cards { grid-column: 1 / span 2; grid-row: 2; gap: 8px; }
  #app.battle .orb { justify-self: center; width: 100px; height: 100px; }
}

/* Segmented tabs: an inset track; the chosen option is raised. */
.seg { display: inline-flex; gap: 4px; padding: 0 2px; flex-wrap: wrap; }
.seg .bt2 { min-height: 40px; }
/* Window header controls */
.w-head .sq { width: 52px; height: 50px; }
.modal-actions { gap: 10px; }
.modal-actions .bt2 { flex: 0 1 auto; min-width: 128px; }
.modal-actions .bt2.primary { min-width: 170px; min-height: 58px; }
@media (max-width: 820px) and (min-width: 521px) {
  .nb .nl img.ptxt { height: 9px !important; width: auto !important; }
}
@media (max-width: 520px) {
  .nav { flex: 1 1 100%; }
  .actionbar { background: linear-gradient(180deg, transparent 0 70px, #2a160c 70px 73px, #9a6438 73px); }
  .side { bottom: 262px; top: auto !important; }
}
@media (max-width: 520px) { .goal { display: none; } }
@media (max-height: 520px) {
  .sb { width: 64px; }

  .sb .sbi { width: 50px; height: 46px; }
  .sb .sbi img.px { width: 16px; height: 16px; }

}
@media (max-height: 520px) {
  .bb { gap: 2px; }

  .bb small { font-size: 11px; }
  .side { top: 62px; gap: 2px; }
  .sb .sbi { height: 42px; }
}

/* Locked features: padlocks and a mini popover saying what unlocks them -------------------- */
.nlk { display: none; pointer-events: none; }
.nb.locked .ni, .nb.locked .nl { filter: grayscale(1) brightness(.72); }
.nb.locked::before { content: ""; position: absolute; inset: -8px -8px -16px; background: rgba(20, 14, 30, .42); pointer-events: none; }
.nb.locked .nlk { display: block; position: absolute; right: -8px; top: -10px; z-index: 3; }
.nb.locked .nlk img.px { width: 32px; height: 32px; }
.sb .sbi { position: relative; }
.sb.locked .nlk { display: block; position: absolute; right: -10px; top: -10px; }
.sb.locked .nlk img.px { width: 16px; height: 16px; }
.sb.locked .sbi > img.px { filter: grayscale(1) brightness(.7); }
.sb.locked .sbt { color: #b8b0c8; }
.locktip { position: absolute; z-index: 95; max-width: 270px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; background: #1a0f12; color: #fff; font-size: 13px; font-weight: 700; line-height: 1.35; box-shadow: 0 0 0 2px #ffcd4d, 0 0 0 4px #1a0f12, 0 6px 0 3px rgba(0, 0, 0, .3); pointer-events: none; }
.locktip img.px { width: 32px; height: 32px; flex: 0 0 auto; }
.locktip::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -10px; width: 14px; height: 9px; margin-left: -7px; background: #ffcd4d; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.locktip.below::after { bottom: auto; top: -10px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.locktip.show { animation: tipIn 200ms steps(4); }
@keyframes tipIn { from { transform: translateY(6px) scale(.92); opacity: 0; } }

/* Sound button: the speaker is struck through while muted. */
#btn-sound.muted img.px { filter: none; }

/* Landscape only on phones and tablets ----------------------------------------------------- */
.rotate { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; color: #fff; background: radial-gradient(circle at 50% 40%, #2a2050, #0b0b16 72%); }
.rotate b { font-size: 22px; color: var(--butter); text-shadow: 2px 2px 0 var(--ink); }
.rotate span { font-size: 15px; color: #c9d2e3; }
.rot-phone { position: relative; width: 60px; height: 100px; background: #2a3050; box-shadow: 0 0 0 4px #c9d2e3, 0 0 0 8px #1a0f12; animation: rotPhone 2.4s steps(12) infinite; margin-bottom: 10px; }
.rot-phone i { position: absolute; inset: 8px 6px 14px; background: linear-gradient(180deg, #73eff7, #3b5dc9); }
@keyframes rotPhone { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }

@media (max-width: 1000px) { .w-head .curs .cur:nth-child(n+3) { display: none; } }

/* Short landscape screens (phones): one row of ten tall deploy cards, compact banners. */
@media (max-height: 520px) {
  .cards { grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: 1fr; gap: 5px; }
  .card .cost { font-size: 13px; }
  .card .cost img.px { width: 16px; height: 16px; }
  .card .cart { height: calc(100% - 18px); }
  .h-center { top: 62px; }
  .banner { grid-template-columns: 150px 1fr; }
  .banner .bn-art { height: 130px; }
  .banner .bn-art .egg-big { width: 56px; height: 68px; }
  .banner .bn-art .fh { height: 48px; }
}

/* Fitted portraits carry their own whole-number size. */
img.px.fit { max-width: none !important; flex: 0 0 auto; }

/* Medals share the Lab card layout. */
.lr.done { opacity: .62; }
.lhead .tiers { margin-left: auto; display: flex; gap: 1px; flex: 0 0 auto; }
.lhead .tiers img.px { width: 16px; height: 16px; }
.lfx .mr { margin-left: auto; display: flex; align-items: center; gap: 3px; color: #2f6ac8; }
.lfx .mr img.px { width: 16px; height: 16px; }

/* Boosts in the stage window: compact chips; the description is in the tooltip. */
.items { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.item { min-height: 56px; padding: 2px 6px; gap: 10px; }
.item > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; line-height: 1.25; }
.item > span .muted { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 11px; }
.item > img.px { width: 32px; height: 32px; flex: 0 0 auto; }
</style>

<body>
<div id="app" class="home">
  <div id="stage">
    <main id="view">
      <canvas id="cv" aria-label="Battlefield"></canvas>

      <!-- Home -->
      <div id="home" class="home-ui">

          <button id="profile" class="profile fx-plaqueWood" type="button" title="Your commander rank grows with every star">
            <span id="avatar" class="avatar fx-rar0"></span>
            <span class="pinfo"><b id="pname">Commander</b><span class="rank">Rank <b id="prank" class="num">1</b></span><span class="rbar fx-insetDark"><i id="prank-fill"></i></span></span>
          </button>
          <div id="curs" class="curs"></div>

            <button type="button" class="nb fx-btn-blue" data-go="army"><span class="ni" data-icon="army"></span><span class="nl">Army</span><i class="badge" hidden></i></button>

          <div class="bh-row">

  function canLevel(s, id) { const h = s.heroes[id]; return !!h && h.lvl < CONFIG.maxLevel && s.coins >= levelCost(id, h.lvl); }
  function levelUp(s, id) {
    if (!canLevel(s, id)) return false;
    s.coins -= levelCost(id, s.heroes[id].lvl);
    s.heroes[id].lvl++;
    s.stats.levelups++;
    return true;
  }

  function evolveNeed(id, form) {
    const r = HERO[id].rarity;
    const e = CONFIG.evolve[r][form];
    return { level: form === 0 ? 10 : 20, coins: e[0], seeds: e[1], fruit: e[2] };
  }
  function canEvolve(s, id) {
    const h = s.heroes[id];
    if (!h || h.form >= 2) return false;
    const n = evolveNeed(id, h.form);
    return h.lvl >= n.level && s.coins >= n.coins && s.seeds >= n.seeds && s.fruit >= n.fruit;
  }
  function evolve(s, id) {
    if (!canEvolve(s, id)) return false;
    const h = s.heroes[id], n = evolveNeed(id, h.form);
    s.coins -= n.coins; s.seeds -= n.seeds; s.fruit -= n.fruit;
    h.form++;
    return true;
  }

  function ownedCount(s) { return Object.keys(s.heroes).length; }

  // Basic heroes unlocked by story stages: content stores [region, stage index].
  function unlockStoryHeroes(s) {
    const got = [];
    for (const h of CT.HEROES) {
      if (h.rarity !== 0 || !h.unlock || s.heroes[h.id]) continue;
      if (s.clear[0][h.unlock[0]] > h.unlock[1]) {
        s.heroes[h.id] = { lvl: 1, plus: 0, form: 0 };
        got.push(h.id);
        const free = s.lineup.indexOf(null);
        if (free >= 0) s.lineup[free] = h.id;
      }
    }
    return got;
  }

  function labCost(id, lvl) { return Math.round(LABS[id].base * Math.pow(1.38, lvl) / 10) * 10; }
  function buyLab(s, id) {
    const l = LABS[id];
    if (!l || s.lab[id] >= l.max) return false;
    const c = labCost(id, s.lab[id]);
    if (s.coins < c) return false;
    s.coins -= c; s.lab[id]++;
    return true;
  }

  // ---------------------------------------------------------------------------
  // Stages
  // ---------------------------------------------------------------------------
  function stageKey(d, r, i) { return d + '-' + r + '-' + i; }
  function starCount(mask) { return (mask & 1) + ((mask >> 1) & 1) + ((mask >> 2) & 1); }
  function totalStars(s) { let n = 0; for (const k in s.stars) n += starCount(s.stars[k]); return n; }
  function regionStars(s, d, r) { let n = 0; for (let i = 0; i < 12; i++) n += starCount(s.stars[stageKey(d, r, i)] || 0); return n; }
  function storyCleared(s) { let n = 0; for (const c of s.clear[0]) n += c; return n; }
  function clearedAll(s, d) { let n = 0; for (const c of s.clear[d]) n += c; return n; }

  function regionOpen(s, d, r) {
    if (d === 0) return r === 0 || s.clear[0][r - 1] >= 12;
    return s.clear[d - 1][r] >= 12;
  }
  function stageOpen(s, d, r, i) { return regionOpen(s, d, r) && s.clear[d][r] >= i; }

  // Builds a stage from its region's enemy pools. Deterministic: the same stage always plays the same way.
  function stageDef(d, r, i) {
    const R = CT.REGIONS[r], D = CT.DIFFICULTIES[d];
    const k = i / 11;
    const mag = Math.round(lerp(R.mag[0], R.mag[1], k) * D.mag * tuned('mag', d, r, i));
    const A = R.pool.a, B = R.pool.b, C = R.pool.c;
    const tempo = 1 / D.rate;
    const lines = [];
    const add = (o) => lines.push(Object.assign({ mag: mag, start: 0, every: [10, 10], max: 0, n: 1 }, o));
    const ev = (lo, hi) => [lo * tempo, hi * tempo];
    // The trickle that never stops.
    add({ e: A[i % A.length], start: 2, every: ev(7 - 2.6 * k, 9.5 - 3.2 * k) });
    if (A.length > 1 && i >= 2) add({ e: A[(i + 1) % A.length], start: 16, every: ev(13, 19) });
    // Support enemies.
    if (i >= 1) add({ e: B[(i - 1) % B.length], start: Math.max(8, 14 - i), every: ev(15 - 4 * k, 21 - 5 * k) });
    if (i >= 4) add({ e: B[(i + 1) % B.length], start: 32, every: ev(21, 29) });
    // Heavies.
    if (i >= 3) add({ e: C[i % C.length], mag: Math.round(mag * 0.9), start: 48, every: ev(42, 56), max: 1 + Math.floor(i / 3), trig: i >= 7 ? 0.85 : undefined });
    // Flavour by slot.
    if (i === 2) add({ e: B[2 % B.length], start: 20, every: ev(9, 12), max: 6 });
    if (i === 5) add({ e: C[0], mag: Math.round(mag * 1.8), boss: true, trig: 0.97, max: 1 });
    if (i === 7) add({ e: A[0], start: 0, every: ev(1.2, 1.6), max: 12, trig: 0.5 });
    if (i === 9) add({ e: B[B.length - 1], start: 5, every: ev(8, 11), max: 10 });
    if (i === 11) {
      add({ e: R.boss, mag: Math.round(100 * D.mag * tuned('mag', d, r, i)), boss: true, trig: 0.995, fallback: 40, max: 1 });
      add({ e: C[0], mag: Math.round(mag * 0.8), start: 6, every: ev(30, 40), max: 3, trig: 0.995 });
    }
    // Every stage after the first few rallies once the tower is in trouble.
    if (i >= 3 && i !== 7) add({ e: B[i % B.length], start: 0, every: ev(2.5, 3.5), max: 3 + Math.floor(i / 4), trig: 0.4 });
    const baseHp = Math.round(lerp(R.baseHp[0], R.baseHp[1], k) * (d === 0 ? 1 : D.mag * 0.7) * tuned('hp', d, r, i) / 10) * 10;
    return {
      kind: 'story', d: d, r: r, i: i, key: stageKey(d, r, i),
      name: R.names[i], region: R.name, theme: R.theme,
      lane: R.lane + (i % 3) * 20, baseHp: baseHp, lines: lines,
      coins: Math.round(lerp(R.coins[0], R.coins[1], k) * D.coins / 10) * 10,
      gems: Math.round((i === 11 ? 100 : i === 5 ? 40 : 20) * D.gems),
      par: Math.round(80 + 6 * i + r * 8),
      boss: i === 11 ? R.boss : null, seed: hashString('stage' + stageKey(d, r, i))
    };
  }

  // Gloom Tower: endless climb, mixing every region's Gloom.
  function towerDef(f) {
    const r = Math.min(CT.REGIONS.length - 1, Math.floor((f - 1) / 6));
    const R = CT.REGIONS[r];
    const k = ((f - 1) % 6) / 5;
    const over = Math.max(0, f - 48);
    const mag = Math.round(lerp(R.mag[0], R.mag[1], k) * 1.6 * Math.pow(1.07, over));
    const rng = mulberry32(hashString('tower' + f));
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const lines = [
      { e: pick(R.pool.a), mag: mag, start: 1, every: [5, 7], max: 0, n: 1 },
      { e: pick(R.pool.b), mag: mag, start: 8, every: [11, 15], max: 0, n: 1 },
      { e: pick(R.pool.b), mag: mag, start: 20, every: [16, 22], max: 0, n: 1 },
      { e: pick(R.pool.c), mag: mag, start: 35, every: [35, 45], max: 3, n: 1 }
    ];
    if (f % 10 === 0) lines.push({ e: R.boss, mag: Math.round(100 * 1.6 * Math.pow(1.07, over)), start: 0, every: [99, 99], max: 1, n: 1, boss: true, trig: 0.995, fallback: 30 });
    return {
      kind: 'tower', floor: f, key: 'tower-' + f, name: 'Floor ' + f, region: 'Gloom Tower', theme: (f - 1) % 8,
      lane: 620, baseHp: Math.round(lerp(R.baseHp[0], R.baseHp[1], k) * 1.4 * Math.pow(1.06, over)), lines: lines,
      coins: Math.round(lerp(R.coins[0], R.coins[1], k) * 1.5 / 10) * 10, gems: f % 5 === 0 ? 100 : 0, gold: f % 10 === 0 ? 1 : 0,
      par: 9999, boss: f % 10 === 0 ? R.boss : null, seed: hashString('tower' + f)
    };
  }

  // Daily events: five levels each, unlocked by story progress.
  const EVENT_LEVELS = [
    { need: 0, region: 0, k: 0.5 }, { need: 12, region: 1, k: 0.5 }, { need: 24, region: 2, k: 0.7 }, { need: 48, region: 4, k: 0.7 }, { need: 72, region: 6, k: 1 }
  ];
  function eventDef(id, lvl) {
    const E = EVENT[id], L = EVENT_LEVELS[lvl];
    const R = CT.REGIONS[L.region];
    const mag = Math.round(lerp(R.mag[0], R.mag[1], L.k) * 1.3);
    const lines = [
      { e: E.foes[0], mag: mag, start: 2, every: [4, 6], max: 0, n: 1 },
      { e: E.foes[1], mag: mag, start: 10, every: [10, 14], max: 0, n: 1 },
      { e: E.foes[2], mag: mag, start: 30, every: [28, 36], max: 3, n: 1 }
    ];
    const rewards = {
      coins: { coins: [3000, 9000, 24000, 60000, 140000][lvl] },
      seeds: { seeds: [2, 3, 4, 5, 6][lvl], fruit: [0, 0, 1, 1, 2][lvl] },
      tickets: { silver: [1, 2, 2, 3, 4][lvl], gold: lvl === 4 ? 1 : 0 }
    }[E.reward];
    return {
      kind: 'event', event: id, lvl: lvl, key: 'event-' + id + '-' + lvl, name: E.name + ' ' + (lvl + 1), region: E.name, theme: E.theme,
      lane: 560, baseHp: Math.round(lerp(R.baseHp[0], R.baseHp[1], L.k)), lines: lines,
      coins: 0, gems: 0, rewards: rewards, par: 9999, boss: null, seed: hashString('ev' + id + lvl)
    };
  }
  function eventOpen(s, id, lvl) { return storyCleared(s) >= Math.max(EVENT[id].unlock, EVENT_LEVELS[lvl].need); }

  // ---------------------------------------------------------------------------
  // Battle simulation
  // ---------------------------------------------------------------------------
  function pouchRate(s, lvl) { return (CONFIG.pouch.rate + CONFIG.pouch.ratePer * (lvl - 1)) * (1 + labVal(s, 'wrate')); }
  function pouchMax(s, lvl) { return (CONFIG.pouch.max + CONFIG.pouch.maxPer * (lvl - 1)) * (1 + labVal(s, 'wcap')); }
  function pouchCost(lvl) { return CONFIG.pouch.cost * (lvl + 1); }
  function roarCharge(s) { return Math.max(CONFIG.roar.minCharge, CONFIG.roar.charge - labVal(s, 'rchg')); }
  function cryBoost(s) { return CONFIG.roar.atk + labVal(s, 'rpow'); }
  function burrowHp(s) { return Math.round(CONFIG.baseHp * (1 + labVal(s, 'base')) * (1 + 0.25 * storyCleared(s) / 12)); }

  function enemyStats(id, mag) {
    const e = ENEMY[id], m = mag / 100;
    return {
      id: id, name: e.name, hp: Math.round(e.hp * m), atk: Math.round(e.atk * m), rng: e.rng, spd: e.spd,
      rate: Math.max(e.rate, e.fore + 0.25), fore: e.fore, kb: e.kb, area: !!e.area, ab: e.ab || {}, traits: e.traits, drop: e.drop, size: e.look.s
    };
  }

  // opts: { items: {rush, armor, roar, charm}, lineup }
  function createBattle(s, def, opts) {
    opts = opts || {};
    const items = opts.items || {};
    const rng = mulberry32((def.seed ^ (opts.seed || 0)) >>> 0);
    const lineup = (opts.lineup || s.lineup).slice(0, 10);
    const b = {
      def: def, L: def.lane, t: 0, rng: rng, state: 'play', items: items,
      pouch: { lvl: items.rush ? 3 : 1, acorns: CONFIG.pouch.max * 0 + labVal(s, 'start') + (items.rush ? 600 : 0) },
      ally: { hp: 0, max: 0, hitT: 0 }, enemy: { hp: def.baseHp, max: def.baseHp, hitT: 0 },
      roar: { charge: items.roar ? 1 : 0, time: roarCharge(s) * (items.roar ? 0.7 : 1), atk: cryBoost(s), dur: CONFIG.roar.time, left: 0 },
      slots: [], ents: [], waves: [], lines: def.lines.map((l) => ({ l: l, active: l.trig === undefined, next: l.start, count: 0, fired: false })),
      nextId: 1, seen: {}, stats: { deploys: 0, kills: 0, roars: 0, pouches: 0, bosses: 0, dmg: 0 }, bossOut: false, bossesLeft: 0
    };
    b.ally.max = b.ally.hp = Math.round(burrowHp(s) * (items.armor ? 1.6 : 1));
    b.pouch.max = pouchMax(s, b.pouch.lvl);
    b.pouch.rate = pouchRate(s, b.pouch.lvl);
    b.pouch.acorns = Math.min(b.pouch.max, b.pouch.acorns);
    b.labState = { wrate: s.lab.wrate, wcap: s.lab.wcap };
    b.sref = s;
    for (const id of lineup) {
      if (!id || !s.heroes[id]) { b.slots.push(null); continue; }
      const st = heroStats(s, id);
      b.slots.push({ id: id, st: st, cd: 0, cdMax: st.cd });
    }
    return b;
  }

  function canDeploy(b, i) {
    const sl = b.slots[i];
    if (!sl || b.state !== 'play') return false;
    if (sl.cd > 0 || b.pouch.acorns < sl.st.cost) return false;
    let n = 0; for (const e of b.ents) if (e.side === 0 && e.state !== 'dead') n++;
    return n < CONFIG.allyCap;
  }
  function deploy(b, i, ev) {
    if (!canDeploy(b, i)) return false;
    const sl = b.slots[i];
    b.pouch.acorns -= sl.st.cost;
    sl.cd = sl.cdMax;
    spawn(b, 0, sl.st, 6 + b.rng() * 4, false);
    b.stats.deploys++;
    if (ev) ev.push({ t: 'deploy', id: sl.id });
    return true;
  }

  function canPouch(b) { return b.state === 'play' && b.pouch.lvl < CONFIG.pouch.levels && b.pouch.acorns >= pouchCost(b.pouch.lvl); }
  function upgradePouch(b, ev) {
    if (!canPouch(b)) return false;
    b.pouch.acorns -= pouchCost(b.pouch.lvl);
    b.pouch.lvl++;
    b.pouch.max = pouchMax(b.sref, b.pouch.lvl);
    b.pouch.rate = pouchRate(b.sref, b.pouch.lvl);
    b.stats.pouches++;
    if (ev) ev.push({ t: 'pouch', lvl: b.pouch.lvl });
    return true;
  }

  function canRoar(b) { return b.state === 'play' && b.roar.charge >= 1; }
  function roar(b, ev) {
    if (!canRoar(b)) return false;
    b.roar.charge = 0;
    b.stats.roars++;
    b.roar.left = b.roar.dur;
    let n = 0;
    for (const e of b.ents) if (e.side === 0 && e.state !== 'dead' && e.state !== 'down') { e.buff = b.roar.dur; n++; }
    if (ev) ev.push({ t: 'roar', n: n });
    return true;
  }

  function spawn(b, side, st, x, boss) {
    const e = {
      id: b.nextId++, side: side, st: st, x: x, y: Math.floor(b.rng() * 7), hp: st.hp, max: st.hp,
      state: 'walk', t: 0, at: 0, cool: 0, hits: 0, kbi: 0, kbFrom: 0, kbTo: 0, kbT: 0,
      freeze: 0, slow: 0, weaken: 0, poison: 0, buff: 0, walkT: b.rng() * 2, boss: !!boss, revived: false, survived: false, burrowed: false, burrowLeft: 0, flash: 0
    };
    b.ents.push(e);
    return e;
  }

  function matches(list, traits) {
    if (!list || !traits || !traits.length) return false;
    for (const t of list) if (t === 'all' || traits.indexOf(t) >= 0) return true;
    return false;
  }

  function targetable(e) { return e.state !== 'dead' && e.state !== 'down' && e.state !== 'burrow'; }

  // Enemies in front of `a` within its reach (plus the tower if it is in reach).
  function findTargets(b, a, all) {
    const out = [];
    const dir = a.side === 0 ? 1 : -1;
    let best = null, bestD = 1e9;
    for (const e of b.ents) {
      if (e.side === a.side || !targetable(e)) continue;
      const d = (e.x - a.x) * dir;
      if (d < -6 || d > a.st.rng) continue;
      if (all) out.push(e);
      else if (d < bestD) { bestD = d; best = e; }
    }
    const towerD = a.side === 0 ? b.L - a.x : a.x;
    const towerIn = towerD <= a.st.rng;
    if (all) { if (towerIn) out.push('tower'); return out; }
    if (best) return [best];
    return towerIn ? ['tower'] : [];
  }

  function knock(b, e, dist, ev) {
    if (e.state === 'dead' || e.state === 'down') return;
    e.state = 'kb'; e.kbT = 0; e.kbFrom = e.x;
    const d = e.boss ? CONFIG.bossKbDist : dist;
    e.kbTo = e.side === 0 ? Math.max(2, e.x - d) : Math.min(b.L - 2, e.x + d);
    e.at = 0; e.hits = 0;
    if (ev) ev.push({ t: 'kb', id: e.id, side: e.side, x: e.x });
  }

  function damageTower(b, side, dmg, ev) {
    const tw = side === 0 ? b.enemy : b.ally;
    tw.hp = Math.max(0, tw.hp - dmg);
    tw.hitT = 0.25;
    if (side === 0) b.stats.dmg += dmg;
    if (ev) ev.push({ t: 'towerHit', side: side, dmg: dmg });
  }

  // One hit from attacker stats `ast` (side `aside`) on entity `e`. Returns true if it connected.
  function strike(b, aside, ast, e, base, ev, att) {
    if (e === 'tower') {
      const mult = aside === 0 ? (ast.ab.base || 1) : 1;
      damageTower(b, aside, Math.round(base * mult), ev);
      return true;
    }
    if (!targetable(e)) return false;
    let dmg = base;
    let crit = false;
    if (aside === 0) {
      const tr = e.st.traits;
      const strong = matches(ast.ab.strong, tr), massive = matches(ast.ab.massive, tr);
      if (tr.indexOf('spooky') >= 0 && !strong && !massive && b.rng() < 0.25) { if (ev) ev.push({ t: 'miss', x: e.x, y: e.y }); return false; }
      if (ast.ab.crit && b.rng() < ast.ab.crit) { crit = true; dmg *= 2; }
      const vs = (t) => matches(ast.ab.strong, [t]) || matches(ast.ab.massive, [t]);
      if (tr.indexOf('armored') >= 0 && !crit && !vs('armored')) dmg *= 0.1;
      if (tr.indexOf('cosmic') >= 0 && !vs('cosmic')) dmg *= 0.5;
      if (massive) dmg *= 3; else if (strong) dmg *= 1.5;
    } else {
      const tr = ast.traits || [];
      if (matches(e.st.ab.resist, tr)) dmg *= 0.25;
      else if (matches(e.st.ab.strong, tr)) dmg *= 0.5;
      if (tr.indexOf('toxic') >= 0) e.poison = 3;
      if (e.buff > 0) dmg *= 1 - CONFIG.roar.guard;
    }
    if (att && att.weaken > 0) dmg *= 0.5;
    dmg = Math.max(1, Math.round(dmg));
    applyDamage(b, e, dmg, ev, ast, crit);
    // Status effects from heroes.
    if (aside === 0 && e.state !== 'dead' && e.state !== 'down') {
      const ab = ast.ab, dur = e.boss ? 0.5 : 1;
      if (ab.freeze && b.rng() < ab.freeze[0]) { e.freeze = Math.max(e.freeze, ab.freeze[1] * dur); if (ev) ev.push({ t: 'status', k: 'freeze', id: e.id }); }
      if (ab.slow && b.rng() < ab.slow[0]) { e.slow = Math.max(e.slow, ab.slow[1] * dur); if (ev) ev.push({ t: 'status', k: 'slow', id: e.id }); }
      if (ab.weaken && b.rng() < ab.weaken[0]) { e.weaken = Math.max(e.weaken, ab.weaken[1] * dur); if (ev) ev.push({ t: 'status', k: 'weaken', id: e.id }); }
      if (ab.kb && e.state !== 'kb' && b.rng() < ab.kb) knock(b, e, CONFIG.kbDist, ev);
    }
    if (ev) ev.push({ t: 'hit', x: e.x, y: e.y, side: aside, crit: crit, big: dmg >= e.max * 0.25, id: e.id });
    return true;
  }

  function applyDamage(b, e, dmg, ev, ast, crit) {
    const before = e.hp;
    e.hp -= dmg;
    e.flash = 0.12;
    if (e.hp <= 0) {
      if (e.side === 0 && e.st.ab.survive && !e.survived && b.rng() < e.st.ab.survive) {
        e.survived = true; e.hp = 1;
        if (ev) ev.push({ t: 'survive', id: e.id, x: e.x });
        knock(b, e, CONFIG.kbDist * 1.5, ev);
        return;
      }
      kill(b, e, ev, ast);
      return;
    }
    // Health-bar knockbacks.
    const n = e.st.kb;
    if (n > 1) {
      let crossed = 0;
      for (let k = e.kbi + 1; k < n; k++) if (e.hp <= e.max * (1 - k / n) && before > e.max * (1 - k / n)) crossed = k;
      if (crossed > e.kbi) { e.kbi = crossed; knock(b, e, CONFIG.kbDist, ev); }
    }
  }

  function kill(b, e, ev, ast) {
    if (e.side === 1 && e.st.traits.indexOf('undead') >= 0 && !e.revived && !(ast && ast.ab && ast.ab.zkill)) {
      e.state = 'down'; e.t = 0; e.hp = 0;
      if (ev) ev.push({ t: 'down', id: e.id, x: e.x });
      return;
    }
    e.state = 'dead'; e.t = 0; e.hp = 0;
    if (e.side === 1) {
      b.stats.kills++;
      if (e.boss) { b.stats.bosses++; b.bossesLeft = Math.max(0, b.bossesLeft - 1); }
      const drop = e.st.drop;
      b.pouch.acorns = Math.min(b.pouch.max, b.pouch.acorns + drop);
      b.coinBonus = (b.coinBonus || 0) + (e.st.ab.coins ? drop * 4 : 0);
      if (ev) ev.push({ t: 'die', side: 1, id: e.id, x: e.x, y: e.y, drop: drop, boss: e.boss, enemy: e.st.id });
    } else if (ev) ev.push({ t: 'die', side: 0, id: e.id, x: e.x, y: e.y });
  }

  function step(b, dt, ev) {
    if (b.state !== 'play') return;
    b.t += dt;
    const L = b.L;
    // Pouch, roar, cooldowns.
    b.pouch.acorns = Math.min(b.pouch.max, b.pouch.acorns + b.pouch.rate * dt);
    b.roar.charge = Math.min(1, b.roar.charge + dt / b.roar.time);
    b.roar.left = Math.max(0, b.roar.left - dt);
    for (const sl of b.slots) if (sl && sl.cd > 0) sl.cd = Math.max(0, sl.cd - dt);
    b.ally.hitT = Math.max(0, b.ally.hitT - dt);
    b.enemy.hitT = Math.max(0, b.enemy.hitT - dt);

    // Enemy spawns.
    const frac = b.enemy.hp / b.enemy.max;
    let enemies = 0;
    for (const e of b.ents) if (e.side === 1 && e.state !== 'dead') enemies++;

  // Second Wind (rewarded): restores the burrow and blows every enemy back.

  function treeBase(dmg) {

    const c = makeCanvas(w, h), g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    const lvl = Math.round(dmg * 3);
    if (!lvl) return c;
    const d = g.getImageData(0, 0, w, h), p = d.data;
    const solid = function (x, y) { return x >= 0 && y >= 0 && x < w && y < h && p[(y * w + x) * 4 + 3] > 0; };
    const tint = function (x, y, k, to) { if (!solid(x, y)) return; const i = (y * w + x) * 4; for (let j = 0; j < 3; j++) p[i + j] = Math.round(p[i + j] + (to[j] - p[i + j]) * k); };

    const spots = [[0.3, 0.62, 4], [0.68, 0.7, 3.5], [0.5, 0.35, 4.5], [0.2, 0.4, 3], [0.78, 0.4, 3.5], [0.42, 0.82, 3], [0.6, 0.2, 4], [0.32, 0.18, 3], [0.85, 0.85, 3]];
    for (let i = 0; i < Math.min(spots.length, lvl * 3); i++) {
      const cx = Math.round(spots[i][0] * w), cy = Math.round(spots[i][1] * h), r = spots[i][2] + lvl * 0.5;
      for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        const q = ((x + 0.5 - cx) * (x + 0.5 - cx) + (y + 0.5 - cy) * (y + 0.5 - cy)) / (r * r);
        if (q <= 1) tint(x, y, q < 0.4 ? 0.62 : 0.4, [34, 20, 26]);
      }

    const crack = function (pts) { for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; const n = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])); for (let t = 0; t <= n; t++) tint(Math.round(w * (a[0] + (b[0] - a[0]) * t / n) / 100), Math.round(h * (a[1] + (b[1] - a[1]) * t / n) / 100), 0.85, [26, 14, 20]); } };
    if (lvl >= 2) { crack([[28, 52], [31, 60], [29, 68], [33, 76]]); crack([[72, 56], [69, 64], [72, 72]]); }

  // The Gloom Tower: a tapered stone keep with battlements, a crystal-tipped spire and a glowing eye, tinted per
  // region. Bricks are laid in staggered courses and shaded light-left / dark-right; damage cracks the stone and
  // knocks merlons and bricks out.
  const TOWER_TINT = ['#6a5a8a', '#9a7a5a', '#7a8aaa', '#5a6a54', '#6a4444', '#5e6a82', '#7a7aa8', '#4a3a6a'];
  function towerCanvas(theme, dmg) {

    const glow = ['#ff6bd0', '#ffcd4d', '#73eff7', '#a7f070', '#ef7d57', '#ff5a5a', '#ffe066', '#c08aff'][theme % 8];
    const lvl = Math.round(dmg * 3);
    const cx = 32, top = 30, bot = H;
    const half = (y) => 13 + (y - top) * 0.11;  // half-width of the keep at row y
    const mortar = mix(T.deep, '#000000', 0.15);
    // Keep body: staggered brick courses.
    for (let y = top; y < bot; y++) {
      const hw = Math.round(half(y)), row = Math.floor((y - top) / 6), inRow = (y - top) % 6;
      for (let x = cx - hw; x < cx + hw; x++) {
        const rel = (x - (cx - hw)) / (2 * hw);
        const off = row % 2 ? 4 : 0;
        const joint = ((x - (cx - hw) + off) % 9) === 0;
        let c = rel < 0.22 ? T.light : rel > 0.7 ? T.dark : T.base;
        if (inRow === 5 || joint) c = mortar;
        else if (inRow === 0 && rel < 0.7) c = mix(c, '#ffffff', 0.12);
        P.set(x, y, c);
      }
    }
    // Battlements.
    const bw = Math.round(half(top)) + 3;
    P.rect(cx - bw, top - 4, bw * 2, 4, T.base); P.rect(cx - bw, top - 4, bw * 2, 1, T.light); P.rect(cx - bw, top - 1, bw * 2, 1, mortar);
    for (let i = 0; i < 4; i++) {
      if (lvl >= 3 && i === 3) continue;
      const mx = cx - bw + 1 + i * Math.round((bw * 2 - 6) / 3);
      P.rect(mx, top - 9, 5, 5, i < 2 ? T.base : T.dark); P.rect(mx, top - 9, 5, 1, T.light);
    }
    // Spire roof and crystal.
    P.tri(cx - 11, top - 9, cx + 11, top - 9, cx, 8, T.deep);
    P.tri(cx - 11, top - 9, cx, top - 9, cx, 8, mix(T.deep, '#ffffff', 0.12));
    P.tri(cx - 3, 9, cx + 3, 9, cx, -1, glow);
    P.tri(cx - 3, 9, cx, 9, cx, -1, mix(glow, '#ffffff', 0.45));
    P.tri(cx - 3, 9, cx + 3, 9, cx, 14, mix(glow, '#1a0a2a', 0.45));
    // Side thorns.
    for (const [y, l] of [[46, 7], [64, 8], [82, 9]]) {
      const hw = Math.round(half(y));
      P.tri(cx - hw, y - 3, cx - hw, y + 3, cx - hw - l, y - 4, T.dark);
      P.tri(cx + hw, y - 3, cx + hw, y + 3, cx + hw + l, y - 4, T.deep);
    }
    // Eye.
    P.ell(cx, 50, 9, 6, '#1a0a2a');
    P.ell(cx, 50, 7, 4.2, glow);
    P.ell(cx - 1.5, 49, 2.5, 1.6, mix(glow, '#ffffff', 0.55));
    P.ell(cx + 0.5, 50.5, 1.8, 3.4, '#1a0a2a');
    P.rect(cx - 9, 43, 18, 2, '#1a0a2a');
    // Gate with portcullis.
    P.ell(cx, 84, 7, 8, '#140a1e'); P.rect(cx - 7, 84, 14, 12, '#140a1e');
    for (let x = cx - 5; x <= cx + 5; x += 3) P.rect(x, 78, 1, 18, mix(T.dark, '#000000', 0.2));
    P.rect(cx - 7, 86, 14, 1, mix(T.dark, '#000000', 0.2));
    // Battle damage: cracks and knocked-out bricks.
    const crack = (pts) => { for (let i = 1; i < pts.length; i++) P.line(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], '#140a1e'); };
    if (lvl >= 1) { crack([[22, 60], [25, 66], [23, 72]]); P.rect(38, 68, 4, 3, T.deep); }
    if (lvl >= 2) { crack([[40, 34], [37, 40], [39, 46]]); crack([[44, 76], [41, 82]]); P.rect(20, 38, 4, 3, T.deep); P.rect(26, 88, 4, 3, T.deep); }
    if (lvl >= 3) { crack([[30, 58], [27, 64], [29, 70], [26, 76]]); P.rect(34, 36, 5, 3, null); P.tri(cx + 4, top - 9, cx + 11, top - 9, cx + 9, top - 15, null); }
    P.outline('#0a0614');

  // ---------------------------------------------------------------------------
  // UI kit: 9-slice frames (used as CSS border-images) and pixel-font titles.
  // Each frame returns { c: canvas, s: slice } or { c, s: [top, right, bottom, left] }.
  // ---------------------------------------------------------------------------
  function grid(w, h) { return new Painter(w, h); }
  function hash2(x, y) { let n = (x * 374761393 + y * 668265263) >>> 0; n = (n ^ (n >>> 13)) * 1274126177 >>> 0; return (n & 1023) / 1023; }

  // Wooden window with a parchment centre. 26×26, slice 9.
  function frameWindow(inner, wood) {
    const P = grid(26, 26), W = 26;
    const T = tones(wood || '#9a6438');
    const out = '#2a160c', line = '#3a2214';
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const e = Math.min(x, y, W - 1 - x, W - 1 - y);
      let c;
      if (e === 0) c = out;
      else if (e <= 6) {
        const top = y < 7 && y <= x && y <= W - 1 - x, left = x < 7 && x < y && x < W - 1 - y;
        const bottom = y > W - 8 && W - 1 - y < x && W - 1 - y < W - 1 - x;
        c = e === 1 ? (top || left ? T.light : T.dark) : (bottom ? T.dark : T.base);
        if (e > 1 && hash2(x, y) > 0.82) c = mix(c, '#3a2214', 0.35);
        if (e === 6) c = mix(c, '#2a160c', 0.25);
      } else if (e === 7) c = line;
      else if (e === 8) c = mix(inner, '#7a5030', y < 13 ? 0.22 : 0.08);
      else c = inner;
      if (!((x === 0 || x === W - 1) && (y === 0 || y === W - 1))) P.set(x, y, c);
    }
    for (const [x, y] of [[3, 3], [W - 4, 3], [3, W - 4], [W - 4, W - 4]]) { P.set(x, y, '#ffe9a0'); P.set(x + 1, y + 1, '#8a5a20'); P.set(x + 1, y, '#d8a848'); P.set(x, y + 1, '#d8a848'); }
    return { c: P.canvas(), s: 9 };
  }

  // A lifted card: outline, highlight, base, two rows of shade. 14×14, slice [4,4,5,4].
  function frameCard(base, edge) {
    const P = grid(14, 14), T = tones(base), O = edge || mix(base, '#2a160c', 0.7);
    for (let y = 0; y < 14; y++) for (let x = 0; x < 14; x++) {
      const corner = (x === 0 || x === 13) && (y === 0 || y === 13);
      if (corner) continue;
      let c = T.base;
      if (x === 0 || y === 0 || x === 13 || y === 13) c = O;
      else if (y === 1) c = mix(base, '#ffffff', 0.45);
      else if (y >= 11) c = mix(base, '#3a2214', 0.28);
      else if (x === 1) c = mix(base, '#ffffff', 0.2);
      P.set(x, y, c);
    }
    return { c: P.canvas(), s: [4, 4, 5, 4] };
  }

  // Inset well (for bars, slots): shadow at the top. 12×12, slice 4.
  function frameInset(base) {
    const P = grid(12, 12);
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
      let c = base;
      if (x === 0 || y === 0 || x === 11 || y === 11) c = mix(base, '#2a160c', 0.6);
      else if (y === 1) c = mix(base, '#2a160c', 0.35);
      else if (y === 2 || x === 1) c = mix(base, '#2a160c', 0.15);
      else if (y === 10) c = mix(base, '#ffffff', 0.25);
      P.set(x, y, c);
    }
    return { c: P.canvas(), s: 4 };
  }

  // Glossy 3D pixel button: rounded corners, a banded face (the centre slice stretches with the button, so the
  // bands keep their proportions), an inner rim and a deep lip. 24×30. Pressed drops the face 3px onto a short lip.
  function frameButton(base, pressed) {
    const W = 24, H = 30, top = pressed ? 3 : 0, lip = pressed ? 2 : 6;
    const P = grid(W, H), ink = '#1a0f12';
    const shape = (x, y) => {
      if (y < top || y > H - 1 || x < 0 || x > W - 1) return false;
      const r = 3, cx = x < r ? r : x > W - 1 - r ? W - 1 - r : x, cy = y < top + r ? top + r : y > H - 1 - r ? H - 1 - r : y;
      const dx = x - cx, dy = y - cy;
      return dx * dx + dy * dy <= r * r + 1;
    };
    const faceEnd = H - 2 - lip;
    const band = (y) => {
      const f = y - top - 1;
      if (f <= 0) return mix(base, '#ffffff', 0.62);
      if (f <= 4) return mix(base, '#ffffff', 0.36);
      if (y >= faceEnd - 1) return mix(base, '#1a0f20', 0.26);
      const k = (y - (top + 4)) / Math.max(1, faceEnd - 2 - (top + 4));
      return k < 0.4 ? mix(base, '#ffffff', 0.14) : k < 0.88 ? base : mix(base, '#1a0f20', 0.12);
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!shape(x, y)) continue;
      const edge = !shape(x - 1, y) || !shape(x + 1, y) || !shape(x, y - 1) || !shape(x, y + 1);
      let c;
      if (edge) c = ink;
      else if (y > faceEnd) c = mix(base, '#2a0f20', y === H - 2 ? 0.66 : 0.52);
      else {
        c = band(y);
        if (!shape(x - 2, y)) c = mix(c, '#ffffff', 0.28);
        else if (!shape(x + 2, y)) c = mix(c, '#1a0f20', 0.2);
      }
      P.set(x, y, c);
    }
    P.set(4, top + 2, '#ffffff'); P.set(5, top + 2, '#ffffff'); P.set(4, top + 3, mix(base, '#ffffff', 0.8));
    return { c: P.canvas(), s: pressed ? [7, 4, 5, 4] : [4, 4, 8, 4] };
  }

  // Rarity frame for hero cards: coloured border with corner gems for Mythic and Legend. 20×20, slice 6.
  function frameRarity(r) {
    const col = RARITY_HEX[r], T = tones(col);
    const inner = mix(col, '#fff8e8', r === 0 ? 0.55 : 0.72);
    const P = grid(20, 20);
    for (let y = 0; y < 20; y++) for (let x = 0; x < 20; x++) {
      const e = Math.min(x, y, 19 - x, 19 - y);
      if ((x === 0 || x === 19) && (y === 0 || y === 19)) continue;
      let c;
      if (e === 0) c = '#1a0f12';
      else if (e === 1) c = (y < 10 && y <= x && y <= 19 - x) || (x < 10 && x < y) ? T.light : T.base;
      else if (e === 2) c = T.base;
      else if (e === 3) c = T.dark;
      else if (e === 4) c = mix(inner, '#7a5030', 0.18);
      else c = inner;
      P.set(x, y, c);
    }
    if (r >= 3) for (const [x, y] of [[1, 1], [16, 1], [1, 16], [16, 16]]) { P.rect(x, y, 3, 3, r === 4 ? '#ff9fd8' : '#fff0a0'); P.set(x + 1, y + 1, '#ffffff'); }
    return { c: P.canvas(), s: 6 };
  }

  // Dark translucent HUD plaque. 12×12, slice 4.
  function framePlaque(base, alpha) {
    const P = grid(12, 12);
    const a = alpha === undefined ? 0.85 : alpha;
    const rgba = (h, al) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')'; };
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
      if ((x === 0 || x === 11) && (y === 0 || y === 11)) continue;
      let c = rgba(base, a);
      if (x === 0 || y === 0 || x === 11 || y === 11) c = '#0b0b16';
      else if (y === 1) c = rgba(mix(base, '#ffffff', 0.3), 1);
      else if (y === 10) c = rgba(mix(base, '#000000', 0.4), 1);
      P.set(x, y, c);
    }
    return { c: P.canvas(), s: 4 };
  }

  // Ribbon banner with folded tails: 3-slice horizontally. 40×20, slice [3,14,5,14].
  function frameRibbon(base) {
    const P = grid(40, 20), T = tones(base), ink = '#1a0f12';
    // Tails.

  // ---------------------------------------------------------------------------

    strollers.length = 0;

    ids.forEach(function (id, i) { strollers.push({ id: id, x: 60 + i * 26 + Math.random() * 10, dir: Math.random() < 0.5 ? 1 : -1, t: Math.random() * 3, walk: 0, pause: Math.random() * 2, y: Math.floor(Math.random() * 6) }); });

  // Our base sits left of x = 0 (its door at the lane start); the Gloom tower at the far end.

  // Camera controls from game.js.

  let minimapOn = true;
  function setMinimap(on) { minimapOn = on; }

  // ---------------------------------------------------------------------------
  // Effects fed by battle events
