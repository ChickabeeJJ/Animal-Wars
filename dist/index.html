:root {
  --gut: 10px;
  --dock-h: 156px;
  --ink: #1a0f12; --deep: #0b0b16; --night: #1a1c2c;
  --brown: #4a2e1e; --brown-l: #7a5030; --wood: #9a6438; --parch: #f3e2bc; --parch-d: #e2cb9a; --parch-dd: #c9a66b;
  --plum: #5d275d; --berry: #b13e53; --peach: #ef7d57; --butter: #ffcd75; --gold: #ffc23d;
  --lime: #a7f070; --green: #38b764; --teal: #257179; --blue: #3b5dc9; --sky: #41a6f6; --cyan: #73eff7;
  --cream: #fff8e8; --mist: #94b0c2; --slate: #566c86; --dusk: #333c57; --pink: #ffa8c5; --lav: #a884f3; --mythic: #ff6fd0;
  --r0: #9aa8bb; --r1: #2f86e0; --r2: #8a5ae0; --r3: #e0a020; --r4: #e04aa8;
  --font: 'Cozy', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--deep); color: var(--brown);
  font-family: var(--font); font-size: 15px; line-height: 1.25;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
button:focus { outline: none; }
button:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }
img.px, .px { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px { display: inline-block; vertical-align: middle; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.rc0 { color: #6a7890; } .rc1 { color: var(--r1); } .rc2 { color: var(--r2); } .rc3 { color: #c08010; } .rc4 { color: var(--r4); }
.good { color: #2e8a3a; } .bad { color: #c03040; }
.muted { color: #8a6a48; font-size: 12px; }

[class*="fx-"] { border-style: solid; border-color: transparent; image-rendering: pixelated; background-clip: padding-box; }
.fx-win { border-width: 18px; border-image: var(--f-win) var(--fs-win) fill / 18px stretch; }
.fx-windark { border-width: 18px; border-image: var(--f-windark) var(--fs-windark) fill / 18px stretch; }
.fx-card { border-width: 8px 8px 10px; border-image: var(--f-card) var(--fs-card) fill / 8px 8px 10px stretch; }
.fx-cardDark { border-width: 8px 8px 10px; border-image: var(--f-cardDark) var(--fs-cardDark) fill / 8px 8px 10px stretch; }
.fx-cardHot { border-width: 8px 8px 10px; border-image: var(--f-cardHot) var(--fs-cardHot) fill / 8px 8px 10px stretch; }
.fx-inset { border-width: 8px; border-image: var(--f-inset) var(--fs-inset) fill / 8px stretch; }
.fx-insetDark { border-width: 6px; border-image: var(--f-insetDark) var(--fs-insetDark) fill / 6px stretch; }
.fx-plaque { border-width: 8px; border-image: var(--f-plaque) var(--fs-plaque) fill / 8px stretch; }
.fx-plaqueWood { border-width: 8px; border-image: var(--f-plaqueWood) var(--fs-plaqueWood) fill / 8px stretch; }
.fx-ribbon { border-width: 6px 28px 10px; border-image: var(--f-ribbon) var(--fs-ribbon) fill / 6px 28px 10px stretch; }
.fx-ribbonGold { border-width: 6px 28px 10px; border-image: var(--f-ribbonGold) var(--fs-ribbonGold) fill / 6px 28px 10px stretch; }
.fx-ribbonBlue { border-width: 6px 28px 10px; border-image: var(--f-ribbonBlue) var(--fs-ribbonBlue) fill / 6px 28px 10px stretch; }
.fx-rar0 { border-width: 12px; border-image: var(--f-rar0) var(--fs-rar0) fill / 12px stretch; }
.fx-rar1 { border-width: 12px; border-image: var(--f-rar1) var(--fs-rar1) fill / 12px stretch; }
.fx-rar2 { border-width: 12px; border-image: var(--f-rar2) var(--fs-rar2) fill / 12px stretch; }
.fx-rar3 { border-width: 12px; border-image: var(--f-rar3) var(--fs-rar3) fill / 12px stretch; }
.fx-rar4 { border-width: 12px; border-image: var(--f-rar4) var(--fs-rar4) fill / 12px stretch; }
/* Buttons: a 3D pixel button; pressed swaps to the shallow frame and drops the content. */
[class*="fx-btn-"] { border-width: 10px 10px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), 0 2px 0 var(--ink); white-space: nowrap; line-height: 1.05; }
.fx-btn-green { border-image: var(--f-btn_green) var(--fs-btn_green) fill / 10px 10px 16px stretch; }
.fx-btn-gold { border-image: var(--f-btn_gold) var(--fs-btn_gold) fill / 10px 10px 16px stretch; color: var(--brown); text-shadow: 0 1px 0 #fff3c0; }
.fx-btn-blue { border-image: var(--f-btn_blue) var(--fs-btn_blue) fill / 10px 10px 16px stretch; }
.fx-btn-red { border-image: var(--f-btn_red) var(--fs-btn_red) fill / 10px 10px 16px stretch; }
.fx-btn-purple { border-image: var(--f-btn_purple) var(--fs-btn_purple) fill / 10px 10px 16px stretch; }
.fx-btn-gray { border-image: var(--f-btn_gray) var(--fs-btn_gray) fill / 10px 10px 16px stretch; color: var(--brown); text-shadow: 0 1px 0 #ffffff; }
.fx-btn-wood { border-image: var(--f-btn_wood) var(--fs-btn_wood) fill / 10px 10px 16px stretch; }
.fx-btn-pink { border-image: var(--f-btn_pink) var(--fs-btn_pink) fill / 10px 10px 16px stretch; color: var(--brown); text-shadow: 0 1px 0 #ffe0ec; }
.fx-btn-dark { border-image: var(--f-btn_dark) var(--fs-btn_dark) fill / 10px 10px 16px stretch; }
[class*="fx-btn-"]:active:not([disabled]) { border-width: 16px 10px 10px; }
.fx-btn-green:active:not([disabled]) { border-image: var(--f-btnp_green) var(--fs-btnp_green) fill / 16px 10px 10px stretch; }
.fx-btn-gold:active:not([disabled]) { border-image: var(--f-btnp_gold) var(--fs-btnp_gold) fill / 16px 10px 10px stretch; }
.fx-btn-blue:active:not([disabled]) { border-image: var(--f-btnp_blue) var(--fs-btnp_blue) fill / 16px 10px 10px stretch; }
.fx-btn-red:active:not([disabled]) { border-image: var(--f-btnp_red) var(--fs-btnp_red) fill / 16px 10px 10px stretch; }
.fx-btn-purple:active:not([disabled]) { border-image: var(--f-btnp_purple) var(--fs-btnp_purple) fill / 16px 10px 10px stretch; }
.fx-btn-gray:active:not([disabled]) { border-image: var(--f-btnp_gray) var(--fs-btnp_gray) fill / 16px 10px 10px stretch; }
.fx-btn-wood:active:not([disabled]) { border-image: var(--f-btnp_wood) var(--fs-btnp_wood) fill / 16px 10px 10px stretch; }
.fx-btn-pink:active:not([disabled]) { border-image: var(--f-btnp_pink) var(--fs-btnp_pink) fill / 16px 10px 10px stretch; }
.fx-btn-dark:active:not([disabled]) { border-image: var(--f-btnp_dark) var(--fs-btnp_dark) fill / 16px 10px 10px stretch; }
[class*="fx-btn-"][disabled] { filter: grayscale(.85) brightness(.75); cursor: default; }
[class*="fx-btn-"] img.px:not(.ptxt) { width: 18px; height: 18px; }

.rbar { display: block; height: 16px; }

.side { position: absolute; right: var(--gut); top: 92px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

.sb .sbt { font-size: 11px; color: var(--butter); text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink); white-space: nowrap; }

.h-center { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }

.goal { min-height: 40px; padding: 2px 14px; color: #fff; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
.goal img.px { height: 22px; width: auto; }

.h-bottom { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 12px; }

.nav { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 10px 8px; border-width: 8px; border-style: solid; border-color: transparent; border-image: var(--f-plaqueWood) var(--fs-plaqueWood) fill / 8px stretch; image-rendering: pixelated; }
.nav button { position: relative; width: 76px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 var(--ink); border-width: 8px 8px 10px; border-style: solid; border-color: transparent; border-image: var(--f-cardDark) var(--fs-cardDark) fill / 8px 8px 10px stretch; image-rendering: pixelated; }

.bossbar { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 10px 4px; pointer-events: none; color: #fff; }

.bossbar .bb2 { width: 240px; height: 16px; }
.bossbar i { display: block; height: 100%; background: linear-gradient(180deg, #ffb0e0, #e04aa8 50%, #8a2070); }
.callout { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; opacity: 0; text-align: center; }

.tut { position: absolute; z-index: 6; max-width: 280px; padding: 2px 6px; font-size: 15px; font-weight: 700; color: var(--brown); pointer-events: none; animation: tutBob 700ms steps(2) infinite; text-align: center; }

/* Dock ------------------------------------------------------------------------------ */
.dock { position: relative; flex: 0 0 auto; height: var(--dock-h); display: flex; align-items: center; gap: 10px; padding: 8px 12px 10px;
  background: repeating-linear-gradient(180deg, #8a5a34 0 3px, #9a6438 3px 22px, #6a4024 22px 24px), #8a5a34;
  box-shadow: inset 0 4px 0 0 #2a160c, inset 0 7px 0 0 #c08a52, inset 0 -3px 0 0 #2a160c; }
.orb { position: relative; flex: 0 0 auto; width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.orb .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--rc, #a7f070) calc(var(--p, 0) * 1turn), #1a1424 0); box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c; }
.orb .orb-in { position: absolute; inset: 9px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; background: radial-gradient(circle at 35% 30%, #a07048, #5a3420 70%); box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 0 #c08a52, inset 0 -4px 0 0 #3a2012; }
.orb .oi img.px { width: 44px; height: 44px; }
.orb .lv { font-size: 13px; color: #fff; text-shadow: 1px 1px 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink); margin-top: -4px; }
.orb .tag { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 0 6px 0 2px; color: var(--butter); font-weight: 700; font-size: 15px; white-space: nowrap; text-shadow: 1px 1px 0 var(--ink); }
.orb .tag img.px { width: 18px; height: 18px; }
.orb:active { transform: translateY(3px); }
.pouch.can .ring { animation: ringGlow 600ms steps(2) infinite; }
.pouch.can .orb-in { background: radial-gradient(circle at 35% 30%, #8ad070, #3a8a3a 70%); }
.pouch.max .tag { color: var(--lime); }
@keyframes ringGlow { 50% { box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c, 0 0 18px 4px rgba(167, 240, 112, .8); } }
.roar { --rc: #ffcd4d; }
.roar .orb-in { background: radial-gradient(circle at 35% 30%, #6a5a8a, #2a2040 70%); box-shadow: 0 0 0 3px var(--ink), inset 0 3px 0 0 #8a7aaa, inset 0 -4px 0 0 #140e22; }
.roar.ready .orb-in { background: radial-gradient(circle at 35% 30%, #fff0a0, #ef7d57 70%); }
.roar.ready { animation: roarShake 500ms steps(2) infinite; }
.roar.ready .ring { box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px var(--ink), 0 5px 0 0 #2a160c, 0 0 22px 6px rgba(255, 205, 77, .85); }
@keyframes roarShake { 50% { transform: rotate(-3deg) scale(1.03); } }
.cards { flex: 1 1 auto; min-width: 0; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: 6px; }
.card { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0; }
.cards .card { border-width: 6px; border-image-width: 6px; }
.card > img.px { height: 112%; width: auto; max-width: 100%; object-fit: contain; margin-top: -6px; }
.card .cost { position: absolute; right: -2px; bottom: -2px; display: flex; align-items: center; gap: 1px; padding: 1px 4px 1px 2px; font-size: 14px; font-weight: 700; color: var(--butter); background: rgba(26, 15, 18, .85); text-shadow: 1px 1px 0 var(--ink); }

.card .cdv { position: absolute; inset: -6px; background: conic-gradient(rgba(16, 10, 24, .72) calc(var(--p, 0) * 1turn), transparent 0); pointer-events: none; }
.card .cds { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
.card.poor > img.px { filter: grayscale(.7) brightness(.8); }

.card.cool > img.px { filter: grayscale(.4) brightness(.85); }

.card.ok:active { transform: translateY(2px); }
.card.ready { animation: readyPop 300ms steps(3); }
@keyframes readyPop { 50% { transform: scale(1.08); filter: brightness(1.4); } }
.card.empty { opacity: .35; }

/* Toasts --------------------------------------------------------------------------- */
.toasts { position: absolute; right: var(--gut); top: 64px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; z-index: 70; max-width: 70%; }
.toast { padding: 0 6px; font-size: 14px; color: #fff; text-shadow: 1px 1px 0 var(--ink); animation: toastIn 240ms steps(4); display: flex; align-items: center; gap: 6px; }
.toast b { color: var(--butter); }
.toast img.px { width: auto; height: 22px; }
.toast.green b { color: var(--lime); } .toast.pink b { color: var(--pink); } .toast.violet b { color: #d0b8ff; }
.toast.out { opacity: 0; transition: opacity 200ms steps(2); }
@keyframes toastIn { from { transform: translateX(30px); opacity: 0; } }

/* Windows (menus) ------------------------------------------------------------------ */
.wrap { position: absolute; inset: 0; z-index: 10; display: flex; align-items: stretch; justify-content: center; padding: 8px; background: rgba(11, 11, 22, .55); animation: wrapIn 200ms steps(4); }
@keyframes wrapIn { from { opacity: 0; } }
.window { position: relative; width: min(1200px, 100%); display: flex; flex-direction: column; min-height: 0; animation: winIn 260ms steps(5); }
@keyframes winIn { from { transform: translateY(30px) scale(.96); } }
.w-head { position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 0 8px; margin: -6px -4px 0; }
.w-title { min-width: 220px; height: 52px; padding: 0 8px; display: flex; align-items: center; justify-content: center; }
.w-title img.px { display: block; }
.w-head .w-title { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); z-index: 2; }
.w-head .curs { margin-left: auto; }
.w-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 4px 10px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--parch-dd) transparent; }
.w-body > * { flex: 0 0 auto; }
.sec { display: flex; align-items: center; gap: 8px; }
.sec h3 { margin: 0; font-size: 18px; color: var(--brown); display: flex; align-items: center; gap: 6px; }
.sec h3 img.px { width: 22px; height: 22px; }
.sec .sub { font-size: 12px; color: #8a6a48; }
.sec .grow { flex: 1; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { position: relative; min-height: 38px; padding: 0 4px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.panel-note { font-size: 12px; color: #8a6a48; margin: 0; }

/* Map */
.diffs { display: flex; gap: 6px; }
.regions { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 8px; scrollbar-width: thin; }
.rg { position: relative; flex: 0 0 auto; width: 132px; padding: 0; text-align: left; color: #fff; }
.rg .rgi { display: block; width: 100%; height: 58px; background-size: cover; image-rendering: pixelated; }
.rg .rgn { display: block; padding: 3px 6px 2px; font-size: 12px; font-weight: 700; background: #2a1a12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg .rgs { position: absolute; right: 4px; top: 4px; font-size: 11px; font-weight: 700; padding: 0 4px; background: rgba(26, 15, 18, .8); color: var(--butter); }
.rg.on { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--gold)); }
.rg.on .rgn { background: #c83e4e; }
.rg.locked .rgi { filter: grayscale(1) brightness(.45); }
.rg.locked .rgn { color: #a08060; }
.rg .lk { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); }
.rg .lk img.px { width: 22px; height: 22px; }
.mapview { position: relative; height: clamp(280px, 52vh, 460px); background-size: cover; background-position: center bottom; image-rendering: pixelated; overflow: hidden; border: 0 !important; border-image: none !important; box-shadow: 0 0 0 3px #2a160c, inset 0 0 0 3px rgba(255, 255, 255, .25), inset 0 -40px 60px -30px rgba(0, 0, 0, .25); margin: 3px; }
.mapscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.mapscroll .mapview { min-width: 640px; }
.mapview svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapview .mv-title { position: absolute; left: 12px; top: 10px; }
.mapview .mv-stars { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 4px; color: #fff; font-weight: 700; font-size: 16px; padding: 0 6px; }
.mapview .mv-stars img.px { width: 20px; height: 20px; }
.node { position: absolute; transform: translate(-50%, -50%); width: 52px; height: 52px; padding: 0; font-size: 18px; }
.node.boss { width: 70px; height: 70px; }
.node .ns { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); display: flex; gap: 0; margin-top: -2px; }
.node .ns img.px { width: 14px; height: 14px; }
.node .nb { position: absolute; left: 50%; bottom: 72%; transform: translateX(-50%); pointer-events: none; }
.node .nb img.px { height: 44px; width: auto; }
.node.boss .nb img.px { height: 62px; }
.node.next { animation: nodeBounce 700ms steps(2) infinite; }
@keyframes nodeBounce { 50% { transform: translate(-50%, -58%); } }
.node .lockic img.px { width: 18px; height: 18px; }
.chests { display: flex; gap: 8px; align-items: stretch; }
.chest { flex: 1; display: flex; align-items: center; gap: 8px; padding: 2px 6px; min-height: 52px; color: var(--brown); text-align: left; font-size: 13px; }
.chest > img.px { width: 34px; height: 34px; }
.chest .cr { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-weight: 700; }
.chest .cr img.px { width: 16px; height: 16px; }
.chest.done { opacity: .55; }
.chest .cbar { height: 10px; margin-top: 3px; }
.chest .cbar i { display: block; height: 100%; background: linear-gradient(180deg, #fff0a0, #ffc23d 50%, #d08a20); }

/* Shared tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 2px 4px; color: var(--brown); text-align: left; min-width: 0; }
.tile h4 { margin: 0; font-size: 15px; }
.loot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.lt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 76px; padding: 0 4px; font-weight: 700; font-size: 16px; color: var(--brown); }
.lt img.px { width: 34px; height: 34px; }
.lt small { font-size: 10px; font-weight: 400; color: #8a6a48; }
.lt.new { filter: drop-shadow(0 0 5px rgba(255, 200, 60, .9)); }
.foes { display: flex; flex-wrap: wrap; gap: 8px; }
.foe { display: flex; flex-direction: column; align-items: center; width: 82px; padding: 0 2px; color: #fff; }
.foe .fi { height: 46px; display: flex; align-items: flex-end; justify-content: center; }
.foe .fi img.px { height: 44px; width: auto; max-width: 74px; }
.foe span { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.05; }
.foe.boss { filter: drop-shadow(0 0 6px var(--mythic)); }
.trait { display: inline-block; padding: 0 4px; font-size: 10px; font-weight: 700; color: var(--ink); text-shadow: none; box-shadow: 0 0 0 1px var(--ink); margin: 1px; }
.goals { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.goals div { display: flex; align-items: center; gap: 8px; }
.goals img.px { width: 20px; height: 20px; }
.goals .off { color: #a08060; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 4px; text-align: left; font-size: 13px; color: var(--brown); min-height: 50px; }
.item > img.px { width: 30px; height: 30px; }
.item b { font-size: 12px; }
.item .ic { position: absolute; right: -4px; top: -6px; font-size: 12px; font-weight: 700; padding: 0 5px; background: var(--ink); color: var(--butter); }
.item.on { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #5ac54f); }
.item.on::after { content: "ON"; position: absolute; left: -4px; top: -6px; font-size: 10px; font-weight: 700; padding: 0 4px; background: #5ac54f; color: var(--ink); }
.item.none { opacity: .5; }
.lineup-mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.lm { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.lm img.px { height: 30px; width: auto; }
.lm.empty { opacity: .35; }

/* Army */
.shelf { padding: 6px 8px 4px; }
.lineup { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.slot { position: relative; aspect-ratio: 1 / 1.05; display: flex; align-items: center; justify-content: center; overflow: visible; padding: 0; min-width: 0; }
.slot img.px { height: 46px; width: auto; max-width: 120%; }
.slot .lv, .hero .lv { position: absolute; right: -8px; bottom: -9px; font-size: 11px; font-weight: 700; padding: 0 4px; color: #fff; background: rgba(26, 15, 18, .85); text-shadow: none; }
.slot.empty { font-size: 22px; color: #a08060; }
.slot.pick { animation: pulse 700ms steps(2) infinite; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.hero { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0; padding: 0; min-height: 120px; color: var(--brown); }
.hero .hi { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 64px; }
.hero .hi img.px { height: 62px; width: auto; max-width: 100%; }
.hero .hn { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.05; margin-top: 2px; }
.hero .hst { display: flex; gap: 0; }
.hero .hst img.px { width: 10px; height: 10px; }
.hero .inl { position: absolute; left: -8px; top: -8px; font-size: 10px; font-weight: 700; color: var(--ink); background: var(--lime); padding: 0 4px; box-shadow: 0 0 0 1px var(--ink); }
.hero .up { position: absolute; right: -6px; top: -8px; width: 18px; height: 18px; background: #5ac54f; box-shadow: 0 0 0 2px var(--ink); clip-path: polygon(50% 0, 100% 55%, 70% 55%, 70% 100%, 30% 100%, 30% 55%, 0 55%); animation: badgePop 800ms steps(2) infinite; }
.hero.locked img.px { filter: brightness(0) invert(.25) sepia(.4); }
.hero.locked .hn { color: #8a6a48; }
.hero:not(.locked):active { transform: translateY(2px); }
.new-tag { position: absolute; right: -8px; top: -8px; font-size: 10px; font-weight: 700; background: #e04848; color: #fff; padding: 0 4px; box-shadow: 0 0 0 1px var(--ink); }

.hd { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
.hd-art { position: relative; height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; background: radial-gradient(circle at 50% 70%, rgba(255, 255, 255, .7), transparent 60%); }
.hd-art > img.px { height: 150px; width: auto; max-width: 196px; }
.hd-art .pedestal { width: 150px; height: 14px; margin-top: -8px; background: #8a6a48; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #b08a60; border-radius: 50%; }
.hd-r { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); padding: 0 6px; color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
.hd-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hd-name { font-size: 22px; font-weight: 700; }
.lvbar { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.lvbar .bar { flex: 1; height: 18px; }
.lvbar .bar i { display: block; height: 100%; background: linear-gradient(180deg, #fff0a0, #ffc23d 50%, #d08a20); }
.forms { display: flex; gap: 6px; }
.forms span { display: flex; flex-direction: column; align-items: center; padding: 0 2px; font-size: 10px; }
.forms img.px { height: 34px; width: auto; }
.forms span.lock img.px { filter: brightness(0) invert(.3); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.stat { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 2px 6px; font-size: 13px; }
.stat img.px { width: 20px; height: 20px; grid-row: 1 / span 2; }
.stat b { font-size: 14px; }
.stat b em { font-style: normal; color: #2e8a3a; font-size: 11px; margin-left: 3px; }
.stat .sbar { grid-column: 2 / span 2; height: 6px; background: #c9a66b; box-shadow: 0 0 0 1px #8a6a48; }
.stat .sbar i { display: block; height: 100%; background: #e07a3a; }
.abil { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: #fff; background: #5a3a24; box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 0 #8a5a3a; text-shadow: 1px 1px 0 var(--ink); }
.chip.hot { background: #8a3a9a; box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 0 #c070d0; }
.evo { padding: 2px 6px; display: flex; align-items: center; gap: 10px; }
.evo .need { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700; }
.evo .need span { display: inline-flex; align-items: center; gap: 2px; }
.evo .need img.px { width: 16px; height: 16px; }
.evo .need .no { color: #c03040; }

/* Lab */
.labg { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.lr { display: grid; grid-template-columns: 56px 1fr auto; gap: 2px 10px; align-items: center; padding: 2px 4px; color: var(--brown); }
.lr .li { grid-row: 1 / span 3; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
.lr .li img.px { width: 32px; height: 32px; }
.lr .ln { font-weight: 700; font-size: 15px; }
.lr .lx { font-size: 12px; color: #6a4a30; grid-column: 2; }
.lr .lx em { font-style: normal; color: #2e8a3a; font-weight: 700; }
.lr .pips { grid-column: 2; display: flex; gap: 2px; }
.lr .pips i { flex: 1; height: 6px; background: #c9a66b; box-shadow: 0 0 0 1px #8a6a48; }
.lr .pips i.on { background: #5ac54f; }
.lr .bt2 { grid-row: 1 / span 3; grid-column: 3; }

/* Rewards */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 2px; font-size: 11px; font-weight: 700; color: var(--brown); text-align: center; }
.day > img.px { width: 34px; height: 34px; }
.day b { font-size: 13px; }
.day.got::after { content: "✓"; position: absolute; inset: -8px; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #2e8a3a; background: rgba(243, 226, 188, .55); text-shadow: 2px 2px 0 #fff; }
.day.today { animation: pulse 900ms steps(2) infinite; }
.mis { display: grid; grid-template-columns: 1fr 140px auto; gap: 4px 10px; align-items: center; padding: 0 4px; font-size: 14px; color: var(--brown); }
.mis .mb { height: 16px; position: relative; }
.mis .mb i { display: block; height: 100%; background: linear-gradient(180deg, #c8f0a0, #5ac54f 50%, #2e8a3a); }
.mis .mb span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.mis .mr { display: flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; }
.mis .mr img.px { width: 18px; height: 18px; }
.mis.claimed { opacity: .5; }
.farm { display: flex; align-items: center; gap: 12px; padding: 2px 6px; }
.farm > img.px { width: 56px; height: 56px; }
.farm .fv { font-size: 22px; font-weight: 700; }

/* Hatchery */
.banner { position: relative; display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; padding: 6px 8px; color: #fff; overflow: hidden; }
.banner .bn-art { position: relative; height: 170px; display: flex; align-items: flex-end; justify-content: center; }
.banner .bn-art::before { content: ""; position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; background: repeating-conic-gradient(rgba(255, 255, 255, .16) 0 12deg, transparent 12deg 30deg); animation: spin 14s linear infinite; }
.banner .bn-art img.px { position: relative; }
.banner .bn-art .egg-big { width: 84px; height: 100px; animation: wob 1.2s steps(2) infinite; }
.banner .bn-art .fh { position: absolute; bottom: 0; height: 74px; width: auto; }
.banner .bn-art .fh.l { left: 2px; } .banner .bn-art .fh.r { right: 2px; }
.banner h3 { margin: 0; }
.banner p { margin: 0; font-size: 13px; text-shadow: 1px 1px 0 var(--ink); }
.banner .feat { display: flex; gap: 6px; flex-wrap: wrap; }
.banner .feat span { display: flex; align-items: center; gap: 4px; padding: 0 6px 0 0; font-size: 12px; font-weight: 700; }
.banner .feat img.px { height: 26px; width: auto; }
.banner .pity { font-size: 12px; color: var(--butter); text-shadow: 1px 1px 0 var(--ink); }
.pitybar { height: 14px; margin-top: 2px; }
.pitybar i { display: block; height: 100%; background: linear-gradient(90deg, #ffc23d, #ff6fd0); }
.bn-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.bn-btns .bt2 img.px { width: 20px; height: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.rates { font-size: 12px; color: #6a4a30; line-height: 1.6; padding: 2px 6px; }
.rates b { font-weight: 700; }

.hatchery { position: absolute; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 42%, #4a3070, #1a1030 55%, #07070f 85%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.h-rays { position: absolute; left: 50%; top: 40%; width: 0; height: 0; pointer-events: none; }
.h-rays.on::before { content: ""; position: absolute; left: -380px; top: -380px; width: 760px; height: 760px; background: repeating-conic-gradient(var(--rc, #ffcd75) 0 9deg, transparent 9deg 24deg); opacity: .4; animation: spin 7s linear infinite; mask: radial-gradient(circle, #000 15%, transparent 68%); -webkit-mask: radial-gradient(circle, #000 15%, transparent 68%); }
.h-stage { position: relative; min-height: 250px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; max-width: 96%; }
.h-stage .egg img.px { width: 140px; height: 168px; }
.h-stage .egg.wob img.px { animation: wob 140ms steps(2) infinite; }
.h-stage .got { display: flex; flex-direction: column; align-items: center; }
.h-stage .got > img.px { height: 200px; width: auto; max-width: 300px; animation: popIn 420ms steps(6); }
.h-stage .got .pedestal { width: 200px; height: 18px; margin-top: -10px; border-radius: 50%; background: radial-gradient(#ffffff55, transparent 70%); }
@keyframes popIn { from { transform: scale(.2) translateY(60px); } 70% { transform: scale(1.15); } }
.h-info { min-height: 92px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
.h-info .hx { font-size: 16px; font-weight: 700; color: var(--lime); text-shadow: 2px 2px 0 var(--ink); }
.h-info .hx.dupe { color: var(--butter); }
.h-btns { display: flex; gap: 12px; }
.sum { display: grid; grid-template-columns: repeat(5, 110px); gap: 10px; }
.sparkle { position: absolute; width: 6px; height: 6px; background: #fff; box-shadow: 0 0 0 2px var(--rc, #ffcd75); animation: spark 900ms steps(6) forwards; pointer-events: none; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* Modal ---------------------------------------------------------------------------- */
.modal { position: absolute; inset: 0; z-index: 40; background: rgba(11, 11, 22, .62); display: flex; align-items: center; justify-content: center; padding: 30px 12px 12px; animation: wrapIn 160ms steps(3); }
.modal-box { position: relative; width: min(640px, 100%); max-height: 100%; overflow: visible; display: flex; flex-direction: column; animation: winIn 240ms steps(5); }
.modal-box > .w-title { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); z-index: 2; }
.modal-box > .w-title:empty { display: none; }
.modal-box .x { position: absolute; right: -22px; top: -22px; z-index: 3; }
#modal-body { overflow-y: auto; max-height: calc(100vh - 170px); display: flex; flex-direction: column; gap: 10px; padding: 14px 2px 2px; color: var(--brown); }
#modal-body p { margin: 0; font-size: 14px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.modal-actions:empty { display: none; }
.modal-actions .bt2 { min-width: 110px; }
.modal.result { background: radial-gradient(circle at 50% 30%, rgba(80, 50, 20, .35), rgba(11, 11, 22, .75)); }
.res-head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -54px; }
.modal.result #modal-body { overflow: visible; max-height: none; }
.modal.result .modal-box { margin-top: 40px; }
.res-head .rays { position: absolute; left: 50%; top: 40px; width: 520px; height: 520px; margin-left: -260px; margin-top: -260px; background: repeating-conic-gradient(rgba(255, 220, 120, .35) 0 10deg, transparent 10deg 26deg); animation: spin 10s linear infinite; mask: radial-gradient(circle, #000 10%, transparent 60%); -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); pointer-events: none; }
.res-head img.ptxt { position: relative; animation: popIn 500ms steps(6); }
.rstars { position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.rstars img.px { width: 52px; height: 52px; }
.rstars img.px:nth-child(2) { width: 66px; height: 66px; margin-bottom: 8px; }
.rstars img.pop { animation: starPop 500ms steps(6) both; }
@keyframes starPop { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } }
.tip-line { font-size: 13px; color: #6a4a30; text-align: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 2px dashed var(--parch-dd); font-size: 15px; font-weight: 700; }
.switch { width: 64px; height: 30px; position: relative; background: #c9a66b; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #a08060; }
.switch::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 22px; background: #fff8e8; box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 0 #c9a66b; transition: left 120ms steps(3); }
.switch.on { background: #5ac54f; box-shadow: 0 0 0 2px var(--ink), inset 0 3px 0 0 #2e8a3a; }
.switch.on::after { left: 34px; }

.tip { position: fixed; z-index: 60; max-width: 240px; padding: 7px 9px; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; }

/* Phones ------------------------------------------------------------------------------- */
@media (max-width: 900px) {
  .quests { display: none; }
  .h-top .curs { padding-top: 6px; gap: 12px; }
  .cur { min-width: 76px; height: 32px; font-size: 14px; padding: 0 14px 0 24px; }
  .cur > img.px { width: 26px; height: 26px; left: -8px; }
  .nav button { width: 60px; height: 56px; font-size: 10px; }
  .nav button img.px { width: 24px; height: 24px; }
  .hd { grid-template-columns: 1fr; }
  .hd-art { height: 180px; }
  .banner { grid-template-columns: 1fr; }
  .banner .bn-art { height: 130px; }
}
@media (max-width: 640px) {
  :root { --gut: 8px; }
  .profile .pinfo { display: none; }
  .h-top .curs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 0 6px 0 16px; justify-items: stretch; }
  .h-top .curs .cur { min-width: 0; }
  .cur .plus { display: none; }
  .side { top: 128px; }
  .h-center { top: 21%; }
  .logo { transform: scale(.8); transform-origin: 50% 0; }
  .avatar { width: 50px; height: 50px; }
  .h-top { flex-wrap: wrap; }
  .h-top .curs { order: 3; flex: 1 1 100%; padding-top: 0; }
  .side { top: 112px; gap: 4px; }
  .sb { width: 62px; }
  .sb .sbi { width: 52px; height: 52px; }
  .h-center { top: 20%; }
  .h-bottom { bottom: 84px; gap: 6px; width: calc(100% - 16px); justify-content: center; }
  .bb { min-width: 74px; height: 70px; }
  .bb.big { min-width: 0; flex: 1 1 auto; height: 84px; }
  .nav { width: calc(100% - 8px); padding: 4px; gap: 3px; justify-content: space-between; }
  .nav button { flex: 1; width: auto; height: 54px; border-width: 6px 4px 8px; }
  .lineup, .lineup-mini { grid-template-columns: repeat(5, 1fr); }
  .roster { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
  .hero { min-height: 104px; }
  .hero .hi img.px { height: 48px; }
  .cal { grid-template-columns: repeat(4, 1fr); }
  .mis { grid-template-columns: 1fr auto; }
  .mis .mb { grid-column: 1 / span 2; grid-row: 2; }
  .sum { grid-template-columns: repeat(5, 62px); gap: 6px; }
  .sum .hero { min-height: 84px; }
  .sum .hero .hi img.px { height: 38px; }
  .stats { grid-template-columns: 1fr; }
  .w-head .w-title { top: -22px; min-width: 160px; }
  .w-head .curs { display: none; }
  .chests { flex-direction: column; }
  .orb { width: 84px; height: 84px; }
  .orb .oi img.px { width: 34px; height: 34px; }
  .bh-plate { min-width: 120px; }
  .bh-name { max-width: 140px; font-size: 12px; }
  .bh-row .hpbar { width: 90px; }
  .acorns b { font-size: 22px; }
}
@media (max-height: 520px) {
  :root { --dock-h: 118px; }
  .h-center { top: 54px; }
  .logo { transform: scale(.42); transform-origin: 50% 0; margin-bottom: -130px; animation: none; }
  .hd-art { height: 140px; }
  .hd-art > img.px { height: 100px; }
  .goal { display: none; }
  .modal.result .modal-box { margin-top: 30px; }
  .modal.result #modal-body { overflow-y: auto; max-height: calc(100vh - 150px); }
  .res-head { margin-top: 0; }
  .rstars img.px { width: 36px; height: 36px; }
  .rstars img.px:nth-child(2) { width: 46px; height: 46px; }
  #modal-body { max-height: calc(100vh - 150px); }
  .modal { padding-top: 34px; }
  .quests { top: 78px; }
  .side { top: 74px; gap: 2px; }
  .sb .sbi { width: 48px; height: 48px; }
  .sb .sbi img.px { width: 24px; height: 24px; }
  .h-bottom { bottom: 84px; }
  .bb { height: 62px; }
  .bb.big { height: 74px; }
  .nav button { height: 50px; }
  .orb { width: 86px; height: 86px; }
  .orb .oi img.px { width: 34px; height: 34px; }
  .mapview { height: 230px; }
}
/* Portrait phones: a wide battlefield band on top, big deploy cards below. */
@media (orientation: portrait) and (max-width: 700px) {
  #app.battle #view { flex: 0 0 auto; height: min(88vw, 56vh); }
  #app.battle .cards { max-height: 300px; align-self: end; }
  #app.battle .dock { flex: 1 1 auto; height: auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 112px 1fr; gap: 14px 10px; padding: 14px 10px 10px; align-items: stretch; }
  #app.battle .cards { grid-column: 1 / span 2; grid-row: 2; gap: 8px; }
  #app.battle .orb { justify-self: center; width: 100px; height: 100px; }
}
</style>
</head>
<body>
<div id="app" class="home">
  <div id="stage">
    <main id="view">
      <canvas id="cv" aria-label="Battlefield"></canvas>

      <!-- Home -->
      <div id="home" class="home-ui">
        <div class="h-top">
          <button id="profile" class="profile fx-plaqueWood" type="button" title="Your commander rank grows with every star">
            <span id="avatar" class="avatar fx-rar0"></span>
            <span class="pinfo"><b id="pname">Commander</b><span class="rank">Rank <b id="prank" class="num">1</b></span><span class="rbar fx-insetDark"><i id="prank-fill"></i></span></span>
          </button>
          <div id="curs" class="curs"></div>
          <div class="corner">
            <button id="btn-sound" class="sq fx-btn-dark" type="button" title="Sound (M)" aria-label="Sound"><span data-icon="sound"></span></button>
            <button id="btn-settings" class="sq fx-btn-dark" type="button" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
          </div>
        </div>
        <div id="quests" class="quests fx-plaque" role="button" tabindex="0" title="Daily quests"></div>
        <div id="side" class="side"></div>
        <div class="h-center">
          <div id="logo" class="logo"></div>
          <div id="goal" class="goal fx-ribbon"></div>
        </div>
        <div class="h-bottom">
          <button id="btn-map" class="bb fx-btn-wood" type="button"><span data-icon="map" class="bi"></span><span class="bl">World<br>Map</span></button>
          <button id="btn-battle" class="bb big fx-btn-green" type="button"><span class="bt" id="battle-t"></span><small id="next-stage"></small></button>
          <button id="btn-hatch" class="bb fx-btn-purple" type="button"><span id="hatch-egg" class="bi egg-bob"></span><span class="bl">Hatch</span><i class="badge" hidden></i></button>
        </div>
        <nav id="nav" class="nav">
          <button type="button" data-go="army"><span class="ni" data-icon="army"></span><span>Army</span><i class="badge" hidden></i></button>
          <button type="button" data-go="lab"><span class="ni" data-icon="lab"></span><span>Lab</span><i class="badge" hidden></i></button>
          <button type="button" data-go="rewards"><span class="ni" data-icon="gift"></span><span>Rewards</span><i class="badge" hidden></i></button>
          <button type="button" data-go="events"><span class="ni" data-icon="event"></span><span>Events</span><i class="badge" hidden></i></button>
          <button type="button" data-go="tower"><span class="ni" data-icon="tower"></span><span>Tower</span><i class="badge" hidden></i></button>
          <button type="button" data-go="medals"><span class="ni" data-icon="medal"></span><span>Medals</span><i class="badge" hidden></i></button>
          <button type="button" data-go="book"><span class="ni" data-icon="book"></span><span>Book</span><i class="badge" hidden></i></button>
        </nav>
      </div>

      <!-- Battle HUD -->
      <div id="bhud" class="bhud" hidden>
        <div class="bh-left">
          <button id="btn-pause" class="sq fx-btn-wood" type="button" title="Pause (P)" aria-label="Pause"><span data-icon="pause"></span></button>
          <div class="bh-plate fx-plaque">
            <div id="bh-name" class="bh-name"></div>
            <div class="hpbar ally fx-insetDark"><i id="bh-ally"></i></div>
          </div>
        </div>
        <div class="bh-right">
          <div class="acorns fx-plaqueWood"><span data-icon="acorn" class="ai"></span><b id="bh-acorns" class="num">0</b><small id="bh-max" class="num">/0</small></div>
          <div class="bh-row">
            <div class="hpbar enemy fx-insetDark"><i id="bh-enemy"></i></div>
            <button id="btn-speed" class="sq sm fx-btn-dark" type="button" title="Speed (F)"><span data-icon="fast"></span><b id="speed-t">1</b></button>
            <button id="btn-cam" class="sq sm fx-btn-dark" type="button" title="Camera follows the front line"><span data-icon="cam"></span></button>
          </div>
        </div>
        <div id="bossbar" class="bossbar fx-plaque" hidden><span id="boss-name"></span><div class="bb2 fx-insetDark"><i id="boss-fill"></i></div></div>
        <div id="callout" class="callout"></div>
        <div id="tut" class="tut fx-cardHot" hidden><span id="tut-text"></span><i class="tut-arrow"></i></div>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </main>

    <!-- Deploy dock -->
    <div id="dock" class="dock" hidden>
      <button id="btn-pouch" class="orb pouch" type="button" title="Upgrade pouch (E)">
        <span class="ring"></span>
        <span class="orb-in"><span data-icon="pouch" class="oi"></span><b class="lv">Lv <span id="pouch-lv">1</span></b></span>
        <span class="tag fx-plaqueWood"><span data-icon="acorn"></span><b id="pouch-cost" class="num">80</b></span>
      </button>
      <div id="cards" class="cards"></div>
      <button id="btn-roar" class="orb roar" type="button" title="Mega Roar (R or Space)">
        <span class="ring"></span>
        <span class="orb-in"><span data-icon="roar" class="oi"></span><b class="lv" id="roar-t">ROAR</b></span>
      </button>
    </div>
  </div>

  <!-- Menu window -->
  <section id="panel" class="wrap" hidden>
    <div class="window fx-win">
      <header class="w-head">
        <button id="panel-back" class="sq fx-btn-wood" type="button" aria-label="Back" title="Back (Esc)"><span data-icon="back"></span></button>
        <div id="panel-title" class="w-title fx-ribbon"></div>
        <div id="panel-cur" class="curs small"></div>
      </header>
      <div id="panel-body" class="w-body"></div>
    </div>
  </section>

  <!-- Hatch show -->
  <div id="hatchery" class="hatchery" hidden>
    <div class="h-rays" id="h-rays"></div>
    <div id="h-stage" class="h-stage"></div>
    <div id="h-info" class="h-info"></div>
    <div class="h-btns"><button id="h-skip" class="bt2 fx-btn-gray" type="button">Skip</button><button id="h-next" class="bt2 fx-btn-gold" type="button">Tap!</button></div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box fx-win" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-x" class="sq sm x fx-btn-red" type="button" aria-label="Close"><span data-icon="close"></span></button>
      <div id="modal-title" class="w-title fx-ribbon"></div>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
  <div id="fade" class="fade"></div>
</div>

<script>
/* Animal Wars — content tables.
 * Heroes, Gloom enemies, regions, events, hatchery banners, missions and medals.
 * Pure data: no DOM, loads in Node and the browser.
 *
 * Stat keys (heroes and enemies, at level 1 / 100% magnification):
 *   hp, atk (damage per attack), rng (reach), spd (units per second), rate (seconds between attacks),
 *   fore (wind-up before the hit lands), kb (knockbacks over its whole health bar), area (hits everything in reach).
 * Hero-only: cost (acorns), cd (seconds before it can be deployed again).
 * Enemy-only: drop (acorns paid into your pouch when it falls), traits.
 * Abilities (ab): strong/massive/resist: [traits | 'all'], kb/crit/survive: chance, freeze/slow/weaken: [chance, seconds],
 *   wave: [chance, level], multi: hits per attack, base: damage multiplier against towers, burrow: distance,
 *   zkill: stops Undead from getting back up, immune: ['kb', 'freeze', 'slow', 'weaken'].
 */
(function (root) {
  'use strict';

  const RARITIES = [
    { id: 0, name: 'Starter', color: '#c3cfdb' },
    { id: 1, name: 'Rare', color: '#41a6f6' },
    { id: 2, name: 'Epic', color: '#a884f3' },
    { id: 3, name: 'Mythic', color: '#ffc23d' },
    { id: 4, name: 'Legend', color: '#ff6fd0' }
  ];

  const TRAITS = {
    winged: { name: 'Winged', color: '#73eff7', desc: 'Flies over the field.' },
    armored: { name: 'Armored', color: '#94b0c2', desc: 'Takes only 10% damage. Critical hits and heroes strong against Armored ignore the plating.' },
    spooky: { name: 'Spooky', color: '#a884f3', desc: 'Dodges 1 in 4 hits unless the hero is strong against Spooky.' },
    toxic: { name: 'Toxic', color: '#a7f070', desc: 'Its hits poison heroes for 3 seconds.' },
    undead: { name: 'Undead', color: '#ef7d57', desc: 'Gets back up once at half health unless finished by a Zombie Slayer.' },
    cosmic: { name: 'Cosmic', color: '#ff6fd0', desc: 'Takes half damage unless the hero is strong against Cosmic.' }
  };

  // Look: sp = species painter, c = main colour, b = belly / second colour, a = accent, s = sprite size (px).
  // g = gear for forms 1, 2 and 3 (the painter adds it on top of the animal).
  const H = (id, names, rarity, look, st, ab, desc, unlock) => Object.assign({ id: id, names: names, rarity: rarity, look: look, ab: ab || {}, desc: desc, unlock: unlock || null }, st);
  const HEROES = [
    // Starters: unlocked by clearing story stages.
    H('pip', ['Pip', 'Captain Pip', 'Sir Pip the Bold'], 0, { sp: 'hamster', c: '#e8a35f', b: '#fff1d6', a: '#3b5dc9', s: 20, g: ['', 'helmet', 'knight'] },
      { hp: 110, atk: 9, rng: 20, spd: 16, rate: 1.2, fore: 0.25, kb: 3, cost: 50, cd: 2.0 }, null, 'Cheap, brave and always ready. Send lots of them to hold the line.'),
    H('shelly', ['Shelly', 'Bastion Shelly', 'Shelly the Rampart'], 0, { sp: 'turtle', c: '#5fb86b', b: '#c9a26b', a: '#94b0c2', s: 20, g: ['', 'helmet', 'spikes'] },
      { hp: 420, atk: 2, rng: 16, spd: 9, rate: 2.0, fore: 0.3, kb: 1, cost: 100, cd: 4.5 }, null, 'A walking wall. Barely hits, but almost nothing gets past her shell.'),
    H('spike', ['Spike', 'Spike Rider', 'Thornstorm Spike'], 0, { sp: 'hedgehog', c: '#9a6a4a', b: '#f3d9b5', a: '#ef7d57', s: 20, g: ['', 'scarf', 'flame'] },
      { hp: 180, atk: 22, rng: 22, spd: 13, rate: 1.4, fore: 0.3, kb: 3, cost: 150, cd: 5, area: true }, null, 'Rolls into crowds and pokes everything nearby.', [0, 1]),
    H('stretch', ['Stretch', 'Lancer Stretch', 'Skyneck Stretch'], 0, { sp: 'giraffe', c: '#f2c14e', b: '#a0612e', a: '#b13e53', s: 34, g: ['', 'lance', 'crown'] },
      { hp: 450, atk: 34, rng: 42, spd: 12, rate: 2.0, fore: 0.45, kb: 3, cost: 250, cd: 6.5 }, null, 'Long neck, long reach. Bonks enemies over the heads of your walls.', [0, 3]),
    H('dash', ['Dash', 'Dash Ninja', 'Blink Dash'], 0, { sp: 'rabbit', c: '#f4f4f4', b: '#ffa8c5', a: '#b13e53', s: 22, g: ['', 'headband', 'ninja'] },
      { hp: 200, atk: 16, rng: 18, spd: 36, rate: 0.5, fore: 0.1, kb: 4, cost: 300, cd: 7 }, null, 'Zooms in and lands a flurry of fast kicks.', [0, 5]),
    H('hoot', ['Hoot', 'Archer Hoot', 'Moonwing Hoot'], 0, { sp: 'owl', c: '#8a6a52', b: '#f0dcbc', a: '#38b764', s: 22, g: ['', 'bow', 'moon'] },
      { hp: 260, atk: 48, rng: 72, spd: 12, rate: 2.4, fore: 0.5, kb: 3, cost: 350, cd: 8 }, { strong: ['winged'] }, 'Keeps the skies clear. Strong against Winged Gloom.', [0, 7]),
    H('croak', ['Croak', 'Croak Mortar', 'Thunder Croak'], 0, { sp: 'frog', c: '#6ccf5a', b: '#e8f5b0', a: '#ffcd75', s: 20, g: ['', 'cannon', 'storm'] },
      { hp: 160, atk: 80, rng: 120, spd: 8, rate: 3.6, fore: 0.6, kb: 3, cost: 500, cd: 12, area: true }, null, 'Lobs big bubbles from far behind the front line.', [0, 9]),
    H('bruno', ['Bruno', 'Grizzly Bruno', 'Titan Bruno'], 0, { sp: 'bear', c: '#8a5a3c', b: '#d9a874', a: '#ffcd75', s: 38, g: ['', 'helmet', 'crown'] },
      { hp: 1800, atk: 180, rng: 32, spd: 10, rate: 2.6, fore: 0.55, kb: 3, cost: 1000, cd: 22, area: true }, null, 'The big one. Smashes whole crowds with one swipe.', [0, 11]),
    H('gnasher', ['Gnasher', 'Gnasher Brute', 'Gnasher Rex'], 0, { sp: 'croc', c: '#3f8f52', b: '#d8e8a0', a: '#94b0c2', s: 26, g: ['', 'helmet', 'crown'] },
      { hp: 900, atk: 130, rng: 28, spd: 10, rate: 2.8, fore: 0.5, kb: 3, cost: 700, cd: 15 }, { crit: 0.1 }, 'Huge bite. Sometimes lands a critical chomp.', [1, 5]),

    // Rare
    H('nibbles', ['Nibbles', 'Acorn Ace Nibbles', 'Nutstorm Nibbles'], 1, { sp: 'squirrel', c: '#d0703a', b: '#ffe2bf', a: '#ffcd75', s: 20, g: ['', 'goggles', 'cape'] },
      { hp: 160, atk: 15, rng: 20, spd: 22, rate: 1.0, fore: 0.2, kb: 3, cost: 75, cd: 2.5 }, null, 'Even cheaper than Pip and twice as quick.'),
    H('baa', ['Baa', 'Woolwall Baa', 'Cloudfleece Baa'], 1, { sp: 'sheep', c: '#f4f4f4', b: '#4a3a4a', a: '#ffa8c5', s: 22, g: ['', 'bell', 'cloud'] },
      { hp: 820, atk: 4, rng: 16, spd: 10, rate: 2.0, fore: 0.3, kb: 2, cost: 150, cd: 5 }, { immune: ['kb'] }, 'So fluffy that knockback attacks just bounce off.'),
    H('sly', ['Sly', 'Ghostbane Sly', 'Spirit Fox Sly'], 1, { sp: 'fox', c: '#ef7d57', b: '#fff1e0', a: '#a884f3', s: 22, g: ['', 'charm', 'spirit'] },
      { hp: 350, atk: 42, rng: 26, spd: 16, rate: 1.6, fore: 0.3, kb: 3, cost: 300, cd: 7 }, { strong: ['spooky'] }, 'Sees through ghostly tricks. Strong against Spooky.'),
    H('honk', ['Honk', 'Honk Commander', 'Thunderhonk'], 1, { sp: 'goose', c: '#f4f4f4', b: '#d6dde6', a: '#ffa34d', s: 24, g: ['', 'helmet', 'storm'] },
      { hp: 320, atk: 36, rng: 24, spd: 18, rate: 1.5, fore: 0.3, kb: 3, cost: 280, cd: 7 }, { kb: 0.3 }, 'Its HONK knocks enemies back 30% of the time.'),
    H('billy', ['Billy', 'Battering Billy', 'Ram King Billy'], 1, { sp: 'goat', c: '#d8cbb5', b: '#f4f4f4', a: '#8a6a52', s: 24, g: ['', 'helmet', 'crown'] },
      { hp: 380, atk: 60, rng: 22, spd: 30, rate: 1.8, fore: 0.35, kb: 3, cost: 360, cd: 8 }, { base: 3 }, 'Charges straight for the Gloom tower and hits it 3× as hard.'),
    H('puff', ['Puff', 'Spiny Puff', 'Pufferstorm'], 1, { sp: 'puffer', c: '#ffcd75', b: '#fff1d6', a: '#41a6f6', s: 20, g: ['', 'spikes', 'bubble'] },
      { hp: 280, atk: 52, rng: 30, spd: 12, rate: 2.0, fore: 0.4, kb: 3, cost: 330, cd: 8, area: true }, { strong: ['toxic'] }, 'Puffs up and splashes crowds. Strong against Toxic.'),
    H('waddle', ['Waddle', 'Frost Waddle', 'Glacier Waddle'], 1, { sp: 'penguin', c: '#2b3352', b: '#f4f4f4', a: '#73eff7', s: 20, g: ['', 'scarf', 'ice'] },
      { hp: 300, atk: 30, rng: 26, spd: 14, rate: 1.6, fore: 0.3, kb: 3, cost: 320, cd: 8 }, { freeze: [0.2, 2] }, 'Slides in with a chilly slap that can freeze enemies for 2 seconds.'),
    H('dig', ['Dig', 'Tunnel Dig', 'Drillmaster Dig'], 1, { sp: 'mole', c: '#5a4a5e', b: '#ffa8c5', a: '#ffcd75', s: 20, g: ['', 'hardhat', 'drill'] },
      { hp: 300, atk: 60, rng: 22, spd: 16, rate: 1.8, fore: 0.3, kb: 3, cost: 380, cd: 9 }, { burrow: 90 }, 'Tunnels under the first enemy it meets and pops up behind the front line.'),
    H('drowsy', ['Drowsy', 'Dreamy Drowsy', 'Slumber Sage'], 1, { sp: 'sloth', c: '#a08a6a', b: '#e8d8b8', a: '#a884f3', s: 22, g: ['', 'nightcap', 'stars'] },
      { hp: 420, atk: 26, rng: 64, spd: 7, rate: 3.0, fore: 0.6, kb: 3, cost: 420, cd: 10, area: true }, { slow: [0.5, 3] }, 'Yawns so hard that enemies slow down for 3 seconds.'),
    H('polly', ['Polly', 'Sky Polly', 'Rainbow Polly'], 1, { sp: 'parrot', c: '#e04848', b: '#ffcd75', a: '#41a6f6', s: 22, g: ['', 'goggles', 'rainbow'] },
