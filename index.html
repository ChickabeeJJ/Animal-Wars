<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title>Animal Wars</title>
<meta name="description" content="Command an army of 50 cute pixel animals against the Gloom. Deploy heroes, smash towers across 8 lands and 288 stages, hatch rare heroes and climb the Gloom Tower.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="home">
  <div id="stage">
    <main id="view">
      <canvas id="cv" aria-label="Battlefield"></canvas>

      <!-- Currency bar (home and menus) -->
      <div id="topbar" class="topbar">
        <div class="cur" id="cur-coins" title="Coins: level up heroes and the Lab"><span class="ci" data-icon="coin"></span><b class="num">0</b></div>
        <div class="cur" id="cur-gems" title="Gems: hatch eggs in the Royal Nest"><span class="ci" data-icon="gem"></span><b class="num">0</b></div>
        <div class="cur" id="cur-silver" title="Silver Eggs: hatch in the Meadow Nest"><span class="ci" data-icon="silver"></span><b class="num">0</b></div>
        <div class="cur" id="cur-gold" title="Gold Eggs: one free Royal Nest hatch each"><span class="ci" data-icon="gold"></span><b class="num">0</b></div>
      </div>

      <!-- Home overlay -->
      <div id="home" class="home-ui">
        <div class="logo"><span class="l1">ANIMAL</span><span class="l2">WARS</span></div>
        <div id="greet" class="greet"></div>
        <div class="home-main">
          <button id="btn-battle" class="btn big gold" type="button"><span class="bb-t">Battle!</span><small id="next-stage"></small></button>
          <div class="home-side">
            <button id="btn-map" class="btn sm" type="button">World Map</button>
          </div>
        </div>
        <nav id="nav" class="nav">
          <button type="button" data-go="hatch"><span class="ni" data-icon="nest"></span><span>Hatch</span><i class="badge" hidden></i></button>
          <button type="button" data-go="army"><span class="ni" data-icon="army"></span><span>Army</span><i class="badge" hidden></i></button>
          <button type="button" data-go="lab"><span class="ni" data-icon="lab"></span><span>Lab</span><i class="badge" hidden></i></button>
          <button type="button" data-go="rewards"><span class="ni" data-icon="gift"></span><span>Rewards</span><i class="badge" hidden></i></button>
          <button type="button" data-go="events"><span class="ni" data-icon="event"></span><span>Events</span><i class="badge" hidden></i></button>
          <button type="button" data-go="tower"><span class="ni" data-icon="tower"></span><span>Tower</span><i class="badge" hidden></i></button>
          <button type="button" data-go="medals"><span class="ni" data-icon="medal"></span><span>Medals</span><i class="badge" hidden></i></button>
          <button type="button" data-go="book"><span class="ni" data-icon="book"></span><span>Book</span><i class="badge" hidden></i></button>
        </nav>
        <div class="home-corner">
          <button id="btn-sound" class="round" type="button" title="Sound (M)" aria-label="Sound"><span data-icon="sound"></span></button>
          <button id="btn-settings" class="round" type="button" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
        </div>
      </div>

      <!-- Battle HUD -->
      <div id="bhud" class="bhud" hidden>
        <div class="bh-left">
          <button id="btn-pause" class="round" type="button" title="Pause (P)" aria-label="Pause"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M1 1h2v6H1zM5 1h2v6H5z" fill="currentColor"/></svg></button>
          <div class="bh-info">
            <div id="bh-name" class="bh-name"></div>
            <div class="hpbar ally"><i id="bh-ally"></i><span id="bh-ally-t" class="num"></span></div>
          </div>
        </div>
        <div class="bh-right">
          <div class="acorns"><span data-icon="acorn"></span><b id="bh-acorns" class="num">0</b><small id="bh-max" class="num">/0</small></div>
          <div class="hpbar enemy"><i id="bh-enemy"></i><span id="bh-enemy-t" class="num"></span></div>
          <div class="bh-btns">
            <button id="btn-speed" class="chip" type="button" title="Speed (F)">×1</button>
            <button id="btn-cam" class="chip" type="button" title="Camera follows the front line">Auto cam</button>
          </div>
        </div>
        <div id="bossbar" class="bossbar" hidden><span id="boss-name"></span><div class="bb"><i id="boss-fill"></i></div></div>
        <div id="callout" class="callout"></div>
        <div id="tut" class="tut" hidden><span id="tut-text"></span><i class="tut-arrow"></i></div>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </main>

    <!-- Deploy dock -->
    <div id="dock" class="dock" hidden>
      <button id="btn-pouch" class="pouch" type="button" title="Upgrade pouch (E)">
        <span class="p-lv">Lv <b id="pouch-lv">1</b></span>
        <span data-icon="pouch" class="p-ic"></span>
        <span class="p-cost"><span id="pouch-cost" class="num">80</span></span>
        <i id="pouch-fill"></i>
      </button>
      <div id="cards" class="cards"></div>
      <button id="btn-roar" class="roar" type="button" title="Mega Roar (R or Space)">
        <i id="roar-fill"></i>
        <span class="r-t">Mega<br>Roar</span>
      </button>
    </div>
  </div>

  <!-- Menu panel -->
  <section id="panel" class="panel" hidden>
    <header class="ph">
      <button id="panel-back" class="round back" type="button" aria-label="Back" title="Back (Esc)"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M4 1h1v1H4v1h3v2H4v1h1v1H4V6H3V5H2V3h1V2h1z" fill="currentColor"/></svg></button>
      <h2 id="panel-title"></h2>
      <div id="panel-cur" class="panel-cur"></div>
    </header>
    <div id="panel-body" class="pb"></div>
  </section>

  <!-- Hatch show -->
  <div id="hatchery" class="hatchery" hidden>
    <div class="h-rays" id="h-rays"></div>
    <div id="h-stage" class="h-stage"></div>
    <div id="h-info" class="h-info"></div>
    <div class="h-btns"><button id="h-skip" class="btn sm" type="button">Skip</button><button id="h-next" class="btn gold" type="button">Tap!</button></div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-x" class="modal-x" type="button" aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
  <div id="tip" class="tip" hidden></div>
</div>

<script src="js/content.js"></script>
<script src="js/tune.js"></script>
<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/platform.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<!-- CrazyGames SDK v3. The game runs normally if it fails to load. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async onload="window.AWPlatform && AWPlatform.onSdkScript()" onerror="window.AWPlatform && AWPlatform.onSdkScript(true)"></script>
</body>
</html>
